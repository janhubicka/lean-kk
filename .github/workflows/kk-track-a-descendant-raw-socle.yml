name: KK Track A candidate descendant complete raw old-socle seed

on:
  pull_request:
    paths:
      - 'Kk/TrackACandidateDescendantRawSocle.lean'
      - 'Kk/TrackACandidateDescendantRawSocleAxiomAudit.lean'
      - 'Kk.lean'
      - 'docs/track_a_candidate_descendant_raw_seed_old_socle_english_audit_20261122.md'
      - '.github/workflows/kk-track-a-descendant-raw-socle.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-a-descendant-raw-socle-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-full-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib cache
        run: lake exe cache get
      - name: Direct compile raw descendant old Kpt socle
        run: lake build Kk.TrackACandidateDescendantRawSocle
      - name: Full Lean library build
        run: lake build
      - name: Strict two-name standard-only transitive axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackACandidateDescendantRawSocleAxiomAudit.lean | tee track-a-descendant-socle-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackACandidateDescendantRawSocleAxiomAudit.lean track-a-descendant-socle-axioms.log
