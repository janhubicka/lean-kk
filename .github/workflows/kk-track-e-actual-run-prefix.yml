name: Lean Track E actual AlgorithmRun prefix stability

on:
  pull_request:
    paths:
      - 'Kk/TrackEActualRunPrefixAxiomAudit.lean'
      - 'Kk/ActualRunNumericHPrefixStability.lean'
      - 'docs/track_e_actual_run_prefix_stability_english_audit.md'
      - '.github/workflows/kk-track-e-actual-run-prefix.yml'
  workflow_dispatch:

concurrency:
  group: track-e-actualrun-prefix-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  full-prefix-stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib cache
        run: lake exe cache get
      - name: Compile genuine two-run full L+ prefix stability
        run: lake build Kk.ActualRunNumericHPrefixStability
      - name: Audit one exact standard-only transitive-axiom report
        run: |
          set -euo pipefail
          lake env lean Kk/TrackEActualRunPrefixAxiomAudit.lean | tee track-e-actualrun-prefix.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackEActualRunPrefixAxiomAudit.lean track-e-actualrun-prefix.log
