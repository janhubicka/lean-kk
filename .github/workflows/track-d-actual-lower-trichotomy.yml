name: KK Track D — actual-run real-lower / structural trichotomy

on:
  pull_request:
    paths:
      - 'Kk/ActualRunStructuralOrLowerReal.lean'
      - 'Kk/B3FailedCutGeneration.lean'
      - 'scripts/check_axioms_track_d_actual_lower_trichotomy.lean'
      - '.github/workflows/track-d-actual-lower-trichotomy.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-d-lower-trichotomy-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  actual-trichotomy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib cache
        run: lake exe cache get
      - name: Build actual-run trichotomy and predecessor
        run: |
          lake build Kk.B3FailedCutGeneration
          lake build Kk.ActualRunStructuralOrLowerReal
      - name: Strict three-theorem axiom gate
        run: |
          set -euo pipefail
          lake env lean scripts/check_axioms_track_d_actual_lower_trichotomy.lean | tee track_d_actual_lower.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py scripts/check_axioms_track_d_actual_lower_trichotomy.lean track_d_actual_lower.log
