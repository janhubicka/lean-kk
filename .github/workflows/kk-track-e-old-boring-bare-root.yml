name: KK Track E old boring one bare root excludes real seed terminals

on:
  pull_request:
    paths:
      - 'Kk/TrackEOldBoringBareRootNoSeed.lean'
      - 'Kk/TrackEOldBoringBareRootNoSeedAxiomAudit.lean'
      - 'docs/track_e_old_boring_bare_new_root_no_seed_english_audit_20261119.md'
      - '.github/workflows/kk-track-e-old-boring-bare-root.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-e-oldbare-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile old-boring Kpt seed exclusion after genuine bare-root addition
        run: lake build Kk.TrackEOldBoringBareRootNoSeed
      - name: Strict three-endpoint transitive-axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackEOldBoringBareRootNoSeedAxiomAudit.lean | tee track-e-oldbare-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackEOldBoringBareRootNoSeedAxiomAudit.lean track-e-oldbare-axioms.log
