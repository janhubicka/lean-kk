name: KK Track F independent lower-bound rank-largeness

on:
  pull_request:
    paths:
      - 'Kk/RankLargenessPartition.lean'
      - 'Kk/RankLargenessAxiomAudit.lean'
      - 'docs/track_f_rank_large_partition_english_audit.md'
      - 'scripts/verify_rank_large_partition.py'
      - '.github/workflows/kk-track-f-rank-large.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-f-rank-large-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  rank-large-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Independent exhaustive finite-model regression
        run: python3 scripts/verify_rank_large_partition.py
      - name: Build actual finite-partition proof
        run: lake build Kk.RankLargenessPartition
      - name: Strict six-theorem standard-only axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/RankLargenessAxiomAudit.lean | tee track-f-rank-large-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/RankLargenessAxiomAudit.lean track-f-rank-large-axioms.log
