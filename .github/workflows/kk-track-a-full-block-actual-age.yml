name: KK Track A actual complete numeric old age

on:
  pull_request:
    paths:
      - 'Kk/FullBlockActualAge.lean'
      - 'docs/full_block_actual_age_english_audit.md'
      - '.github/workflows/kk-track-a-full-block-actual-age.yml'
  push:
    branches: [kk-track-a-actual-full-prefix-age-20261115]
  workflow_dispatch:

concurrency:
  group: kk-track-a-full-block-actual-age-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-actual-old-age:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Restore Mathlib cache
        run: lake exe cache get
      - name: Independent 23,040-case finite old-age regression
        run: python3 scripts/check_actual_full_block_age.py
      - name: Explicitly compile actual full-block old-to-top columns
        run: lake build Kk.FullBlockActualTopColumn
      - name: Explicitly compile actual full-block raw/canonical age
        run: lake build Kk.FullBlockActualAge
      - name: Strict exact qualified named transitive axiom audit
        run: |
          set -euo pipefail
          python3 scripts/check_axiom_report.py --self-test
          lake env lean Kk/FullBlockActualTopColumn.lean | tee full-top-column-axioms.log
          python3 scripts/check_axiom_report.py Kk/FullBlockActualTopColumn.lean full-top-column-axioms.log
          lake env lean Kk/FullBlockActualAge.lean | tee full-actual-age-axioms.log
          python3 scripts/check_axiom_report.py Kk/FullBlockActualAge.lean full-actual-age-axioms.log
      - name: Full repository build
        run: lake build
