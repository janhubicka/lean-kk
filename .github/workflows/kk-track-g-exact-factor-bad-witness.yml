name: KK Track G exact factor Bad physical witness and old-full-pair novelty

on:
  pull_request:
    paths:
      - 'Kk/TrackGExactFactorBadWitness.lean'
      - 'Kk/TrackGExactFactorBadWitnessAxiomAudit.lean'
      - 'docs/track_g_exact_factor_bad_witness_english_audit_20261121.md'
      - '.github/workflows/kk-track-g-exact-factor-bad-witness.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-g-exact-factor-bad-witness-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile single-source factor Bad witness extraction and novel Lplus pair
        run: lake build Kk.TrackGExactFactorBadWitness
      - name: Strict two-name standard-only transitive axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackGExactFactorBadWitnessAxiomAudit.lean | tee track-g-exact-factor-bad-witness-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackGExactFactorBadWitnessAxiomAudit.lean track-g-exact-factor-bad-witness-axioms.log
