name: KK Track F actual low-rank compatible transport
on:
  pull_request:
    paths:
      - 'Kk/TrackFLowRankCompatibility.lean'
      - 'Kk/TrackFLowRankCompatibilityAxiomAudit.lean'
      - 'docs/track_f_low_rank_compatible_transport_english_audit.md'
      - '.github/workflows/kk-track-f-low-rank-transport.yml'
  workflow_dispatch:
concurrency:
  group: kk-track-f-low-rank-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  low-rank-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Build low rank compatible transport
        run: lake build Kk.TrackFLowRankCompatibility
      - name: Strict low-rank theorem standard-only axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackFLowRankCompatibilityAxiomAudit.lean | tee track-f-low-rank-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackFLowRankCompatibilityAxiomAudit.lean track-f-low-rank-axioms.log
