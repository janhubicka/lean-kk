name: KK Track C physical coherent index adapter

on:
  pull_request:
    paths:
      - 'Kk/ConstructedCoherentIndexAdapter.lean'
      - 'Kk/TrackCPhysicalIndexAdapterAxiomAudit.lean'
      - 'docs/track_c_physical_index_adapter_english_audit.md'
      - '.github/workflows/kk-track-c-physical-index-adapter.yml'
  workflow_dispatch:

jobs:
  physical-index-adapter-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib cache
        run: lake exe cache get
      - name: Compile physical index adapter and diagram coherence
        run: lake build Kk.ConstructedCoherentIndexAdapter
      - name: Strict six-theorem standard-only axiom audit
        run: |
          set -euo pipefail
          lake env lean Kk/TrackCPhysicalIndexAdapterAxiomAudit.lean | tee track-c-physical-index-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackCPhysicalIndexAdapterAxiomAudit.lean track-c-physical-index-axioms.log
