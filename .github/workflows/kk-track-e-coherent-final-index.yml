name: KK Track E coherent all-cut final physical Kpt index transport

on:
  pull_request:
    paths:
      - 'Kk/TrackECoherentFinalIndexRetention.lean'
      - 'Kk/TrackECoherentFinalIndexRetentionAxiomAudit.lean'
      - 'docs/track_e_coherent_physical_old_index_english_audit.md'
      - '.github/workflows/kk-track-e-coherent-final-index.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-e-coherentindex-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile coherent crossheight all-cut final-index Kpt transport
        run: lake build Kk.TrackECoherentFinalIndexRetention
      - name: Strict two-endpoint transitive-axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackECoherentFinalIndexRetentionAxiomAudit.lean | tee track-e-coherentindex-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackECoherentFinalIndexRetentionAxiomAudit.lean track-e-coherentindex-axioms.log
