name: Track F actual E coding age

on:
  pull_request:
    paths:
      - 'Kk/TrackFActualCodingSet.lean'
      - 'docs/track_f_actual_coding_set_english_audit.md'
      - 'scripts/track_f_actual_coding_axioms.lean'
      - '.github/workflows/track-f-actual-coding-lean.yml'
  workflow_dispatch:

jobs:
  exact-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib cache
        run: lake exe cache get
      - name: Build actual coding module
        run: lake build Kk.TrackFActualCodingSet
      - name: Check three named standard-only axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean scripts/track_f_actual_coding_axioms.lean | tee actual-coding.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path("actual-coding.log").read_text()
          names=[
            "Kk.trackFConcretePassingSet_eq_abstract",
            "Kk.trackFWordRaw_coding_by_literal_E_exact",
            "Kk.trackFWordRaw_coding_by_abstractSet_exact",
          ]
          allowed={"propext","Classical.choice","Quot.sound"}
          for name in names:
              m=re.search(r"(?m)^'"+re.escape(name)+r"' depends on axioms: \[([^\]]*)\]",lines)
              if not m: raise SystemExit("MISSING "+name)
              used={x.strip() for x in m.group(1).split(",") if x.strip()}
              if used-allowed: raise SystemExit("FAIL "+name+": "+str(used-allowed))
              print("PASS "+name+" "+str(sorted(used)))
          PY
