name: KK Track G physical bad-cut coordinate transport

on:
  pull_request:
    paths:
      - 'Kk/TrackGBadCutCoordinateTransport.lean'
      - 'Kk/TrackGBadCutCoordinateTransportAxiomAudit.lean'
      - 'docs/track_g_physical_badcuts_reindex_english_audit_20261116.md'
      - '.github/workflows/kk-track-g-badcut-reindex.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-g-badcut-reindex-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile physical bad-cut reindex module explicitly
        run: lake build Kk.TrackGBadCutCoordinateTransport
      - name: Strict two-endpoint named transitive-axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackGBadCutCoordinateTransportAxiomAudit.lean | tee track-g-badcut-reindex-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackGBadCutCoordinateTransportAxiomAudit.lean track-g-badcut-reindex-axioms.log
