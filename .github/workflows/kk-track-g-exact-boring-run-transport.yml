name: KK Track G exact I-F transfer iff compatible old-boring actual source certificates

on:
  pull_request:
    paths:
      - 'Kk/TrackGExactBoringRunTransport.lean'
      - 'Kk/TrackGExactBoringRunTransportAxiomAudit.lean'
      - 'docs/track_g_exact_boring_transport_criterion_english_audit_20261119.md'
      - '.github/workflows/kk-track-g-exact-boring-run-transport.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-g-exact-boring-run-transport-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile exact old-boring source monoid compatibility criterion
        run: lake build Kk.TrackGExactBoringRunTransport
      - name: Strict two-name standard-only transitive axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackGExactBoringRunTransportAxiomAudit.lean | tee track-g-exact-boring-run-transport-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackGExactBoringRunTransportAxiomAudit.lean track-g-exact-boring-run-transport-axioms.log
