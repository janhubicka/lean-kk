name: KK Track A exact physical ordinary-L raw cut spectrum

on:
  pull_request:
    paths:
      - 'Kk/TrackAPhysicalCriticalSpectrum.lean'
      - 'Kk/TrackAPhysicalCriticalSpectrumAxiomAudit.lean'
      - 'Kk.lean'
      - 'docs/track_a_exact_physical_critical_spectrum_english_audit_20261122.md'
      - '.github/workflows/kk-track-a-physical-critical-spectrum.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-a-physical-critical-spectrum-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib cache
        run: lake exe cache get
      - name: Compile exact spectrum theorem directly
        run: lake build Kk.TrackAPhysicalCriticalSpectrum
      - name: Full Lean library build
        run: lake build
      - name: Strict qualified two-name standard-only axiom audit
        run: |
          set -euo pipefail
          lake env lean Kk/TrackAPhysicalCriticalSpectrumAxiomAudit.lean | tee track-a-spectrum-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackAPhysicalCriticalSpectrumAxiomAudit.lean track-a-spectrum-axioms.log
