name: KK Track F complete Nat witness numeric age
on:
  pull_request:
    paths:
      - 'Kk/TrackFCompleteNatWitnessNumericAge.lean'
      - 'Kk/TrackFCompleteNatWitnessNumericAgeAxiomAudit.lean'
      - 'docs/track_f_complete_nat_witness_numeric_age_english_audit_20261122.md'
      - '.github/workflows/kk-track-f-nat-witness-numeric-age.yml'
  workflow_dispatch:
concurrency:
  group: kk-track-f-nat-witness-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  numeric-age:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Build complete Nat witness numeric age theorem
        run: lake build Kk.TrackFCompleteNatWitnessNumericAge
      - name: Strict six-theorem standard-only axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackFCompleteNatWitnessNumericAgeAxiomAudit.lean | tee track-f-nat-witness-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackFCompleteNatWitnessNumericAgeAxiomAudit.lean track-f-nat-witness-axioms.log
