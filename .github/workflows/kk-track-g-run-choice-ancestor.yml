name: KK Track G choice-independent boring-factor action on actual same-seed sources

on:
  pull_request:
    paths:
      - 'Kk/TrackGRunChoiceAncestor.lean'
      - 'Kk/TrackGRunChoiceAncestorAxiomAudit.lean'
      - 'docs/track_g_run_choice_ancestor_english_audit_20261118.md'
      - '.github/workflows/kk-track-g-run-choice-ancestor.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-g-run-choice-ancestor-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile choice-independent actual boring-factor ancestor action
        run: lake build Kk.TrackGRunChoiceAncestor
      - name: Strict one-name standard-only transitive axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackGRunChoiceAncestorAxiomAudit.lean | tee track-g-run-choice-ancestor-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackGRunChoiceAncestorAxiomAudit.lean track-g-run-choice-ancestor-axioms.log
