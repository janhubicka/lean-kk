name: KK Track F actual source coding fibre and root
on:
  pull_request:
    paths:
      - 'Kk/TrackFActualCodingFibre.lean'
      - 'Kk/TrackFActualCodingFibreAxiomAudit.lean'
      - 'docs/track_f_actual_coding_fibre_english_audit.md'
      - '.github/workflows/kk-track-f-actual-coding-fibre.yml'
  workflow_dispatch:
concurrency:
  group: kk-track-f-coding-fibre-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  actual-coding-fibre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Build actual coding-node/root source fibre
        run: lake build Kk.TrackFActualCodingFibre
      - name: Strict five-theorem standard-only axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackFActualCodingFibreAxiomAudit.lean | tee track-f-actual-coding-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackFActualCodingFibreAxiomAudit.lean track-f-actual-coding-axioms.log
