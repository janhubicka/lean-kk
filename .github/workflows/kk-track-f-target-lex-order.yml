name: KK Track F actual target lex persistence
on:
  pull_request:
    paths:
      - 'Kk/TrackFTargetLexOrderPersistence.lean'
      - 'Kk/TrackFTargetLexOrderPersistenceAxiomAudit.lean'
      - 'docs/track_f_actual_target_lex_persistence_english_audit_20261122.md'
      - '.github/workflows/kk-track-f-target-lex-order.yml'
  workflow_dispatch:
concurrency:
  group: kk-track-f-target-lex-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  target-lex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Build actual target lex persistence
        run: lake build Kk.TrackFTargetLexOrderPersistence
      - name: Strict three-theorem standard-only axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackFTargetLexOrderPersistenceAxiomAudit.lean | tee target-lex-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackFTargetLexOrderPersistenceAxiomAudit.lean target-lex-axioms.log
