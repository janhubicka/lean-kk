name: KK Track C cut-visible closure

on:
  pull_request:
    paths:
      - 'Kk/CutVisibleClosureAbsorption.lean'
      - 'Kk/TrackCCutVisibleAxiomAudit.lean'
      - 'docs/track_c_cut_visible_closure_english_audit.md'
      - '.github/workflows/kk-track-c-cut-visible.yml'
  workflow_dispatch:

jobs:
  cut-visible-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Build the graded cut-visible source module
        run: lake build Kk.CutVisibleClosureAbsorption
      - name: Strict six-theorem standard-only axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackCCutVisibleAxiomAudit.lean | tee track-c-visible-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackCCutVisibleAxiomAudit.lean track-c-visible-axioms.log
