name: Lean Track C true AlgorithmRun seed monotonicity

on:
  push:
    branches: [kk-track-c-monotone-algorithm-retention-20261114]
    paths:
      - 'Kk/AlgorithmRunSeedMonotonicity.lean'
      - 'docs/track_c_algorithmRun_seed_monotonicity_english_audit.md'
      - '.github/workflows/lean-track-c-run-mono.yml'
  pull_request:
    paths:
      - 'Kk/AlgorithmRunSeedMonotonicity.lean'
      - 'docs/track_c_algorithmRun_seed_monotonicity_english_audit.md'
      - '.github/workflows/lean-track-c-run-mono.yml'
  workflow_dispatch:

concurrency:
  group: track-c-run-mono-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  actual-run-monotonicity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib cache
        run: lake exe cache get
      - name: Compile true AlgorithmRun seed monotonicity
        run: lake build Kk.AlgorithmRunSeedMonotonicity
      - name: Strictly audit five exact named standard-only axioms
        run: |
          set -euo pipefail
          lake env lean Kk/AlgorithmRunSeedMonotonicity.lean | tee track-c-run-mono.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/AlgorithmRunSeedMonotonicity.lean track-c-run-mono.log
