name: KK Track F actual independent-code vertex
on:
  pull_request:
    paths:
      - 'Kk/TrackFActualIndependentCode.lean'
      - 'Kk/TrackFActualIndependentCodeAxiomAudit.lean'
      - 'docs/track_f_rankzero_actual_independent_code_english_audit_20261121.md'
      - '.github/workflows/kk-track-f-actual-independent-code.yml'
  workflow_dispatch:
concurrency:
  group: kk-track-f-actual-code-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  independent-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Build actual finite-past independent code
        run: lake build Kk.TrackFActualIndependentCode
      - name: Strict three-theorem standard-only axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackFActualIndependentCodeAxiomAudit.lean | tee track-f-code-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackFActualIndependentCodeAxiomAudit.lean track-f-code-axioms.log
