name: KK Track E maximal OLD Kpt socle prefix test per physical original

on:
  pull_request:
    paths:
      - 'Kk/TrackEOldSocleOriginalMaxFrontier.lean'
      - 'Kk/TrackEOldSocleOriginalMaxFrontierAxiomAudit.lean'
      - 'docs/track_e_old_socle_original_max_frontier_english_audit_20261120.md'
      - '.github/workflows/kk-track-e-old-socle-original-max.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-e-soclemax-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile maximal old-Kpt-prefix original source certificate
        run: lake build Kk.TrackEOldSocleOriginalMaxFrontier
      - name: Strict five-endpoint transitive-axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackEOldSocleOriginalMaxFrontierAxiomAudit.lean | tee track-e-soclemax-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackEOldSocleOriginalMaxFrontierAxiomAudit.lean track-e-soclemax-axioms.log
