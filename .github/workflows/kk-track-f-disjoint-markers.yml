name: KK Track F disjoint daughter marker locality
on:
  pull_request:
    paths:
      - 'Kk/TrackFDisjointDaughterMarkers.lean'
      - 'Kk/TrackFDisjointDaughterMarkersAxiomAudit.lean'
      - 'docs/track_f_disjoint_daughter_markers_english_audit.md'
      - '.github/workflows/kk-track-f-disjoint-markers.yml'
  workflow_dispatch:
concurrency:
  group: kk-track-f-daughter-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  disjoint-daughter-locality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Build all-support disjoint daughter marker theorem
        run: lake build Kk.TrackFDisjointDaughterMarkers
      - name: Strict five-theorem standard-only axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackFDisjointDaughterMarkersAxiomAudit.lean | tee track-f-daughter-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackFDisjointDaughterMarkersAxiomAudit.lean track-f-daughter-axioms.log
