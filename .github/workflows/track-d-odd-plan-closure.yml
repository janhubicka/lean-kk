name: KK Track D — omitted odd cut from descending free-closed Plan

on:
  pull_request:
    paths:
      - 'Kk/TrackDOddPlanFreeClosure.lean'
      - 'Kk/TrackDOddStageNoFreeEnd.lean'
      - 'scripts/check_axioms_track_d_odd_plan_closure.lean'
      - '.github/workflows/track-d-odd-plan-closure.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-d-odd-plan-closure-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  odd-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib cache
        run: lake exe cache get
      - name: Build odd Plan closure and source theorem
        run: lake build Kk.TrackDOddPlanFreeClosure
      - name: Strict three-name standard-only axiom report
        run: |
          set -euo pipefail
          lake env lean scripts/check_axioms_track_d_odd_plan_closure.lean | tee track_d_odd_plan_closure.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py scripts/check_axioms_track_d_odd_plan_closure.lean track_d_odd_plan_closure.log
