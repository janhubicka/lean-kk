name: KK Track F physical numeric age from finite classes
on:
  pull_request:
    paths:
      - 'Kk/TrackFPhysicalNumericAgeFromClasses.lean'
      - 'Kk/TrackFPhysicalNumericAgeFromClassesAxiomAudit.lean'
      - 'docs/track_f_physical_numeric_endpoint_from_classes_english_audit_20261122.md'
      - '.github/workflows/kk-track-f-physical-numeric-age-from-classes.yml'
  workflow_dispatch:
concurrency:
  group: kk-track-f-physical-numeric-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  physical-numeric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Build actual K4 physical numeric age endpoint
        run: lake build Kk.TrackFPhysicalNumericAgeFromClasses
      - name: Strict three-theorem standard-only axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackFPhysicalNumericAgeFromClassesAxiomAudit.lean | tee physical-numeric-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackFPhysicalNumericAgeFromClassesAxiomAudit.lean physical-numeric-axioms.log
