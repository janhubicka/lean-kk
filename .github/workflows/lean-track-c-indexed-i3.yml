name: Lean Track C indexed I3 full B3

on:
  push:
    branches: [kk-track-c-i3-from-indexed-structural-20261114]
    paths:
      - 'Kk/NumericHIndexedI3Failure.lean'
      - 'docs/track_c_indexed_i3_failure_english_audit.md'
      - '.github/workflows/lean-track-c-indexed-i3.yml'
  pull_request:
    paths:
      - 'Kk/NumericHIndexedI3Failure.lean'
      - 'docs/track_c_indexed_i3_failure_english_audit.md'
      - '.github/workflows/lean-track-c-indexed-i3.yml'
  workflow_dispatch:

concurrency:
  group: track-c-indexed-i3-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  indexed-i3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib cache
        run: lake exe cache get
      - name: Compile complete indexed I3/B3 module
        run: lake build Kk.NumericHIndexedI3Failure
      - name: Audit both exact standard-only theorem reports
        run: |
          set -euo pipefail
          lake env lean Kk/NumericHIndexedI3Failure.lean | tee track-c-indexed-i3.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/NumericHIndexedI3Failure.lean track-c-indexed-i3.log
