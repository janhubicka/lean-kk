name: KK Track F genuine triangle insertion preparation
on:
  pull_request:
    paths:
      - 'Kk/TrackFPositiveInsertionCapacity.lean'
      - 'Kk/TrackFPositiveInsertionCapacityAxiomAudit.lean'
      - 'docs/track_f_rank_three_triangle_english_audit.md'
      - '.github/workflows/kk-track-f-triangle-prep.yml'
  workflow_dispatch:
concurrency:
  group: kk-track-f-triangle-prep-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  triangle-preparation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Build actual triangle insertion preparation
        run: lake build Kk.TrackFPositiveInsertionCapacity
      - name: Strict four-theorem standard-only axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackFPositiveInsertionCapacityAxiomAudit.lean | tee track-f-triangle-prep-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackFPositiveInsertionCapacityAxiomAudit.lean track-f-triangle-prep-axioms.log
