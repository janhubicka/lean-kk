name: KK Track G arbitrary finite-block monoid factor and exact I criterion

on:
  pull_request:
    paths:
      - 'Kk/TrackGArbitraryBlockFactor.lean'
      - 'Kk/TrackGArbitraryBlockFactorAxiomAudit.lean'
      - 'docs/track_g_arbitrary_block_factor_english_audit_20261117.md'
      - '.github/workflows/kk-track-g-any-block-factor.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-g-any-block-factor-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile any actual finite-block MMap factor
        run: lake build Kk.TrackGArbitraryBlockFactor
      - name: Strict two-name standard-only transitive axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackGArbitraryBlockFactorAxiomAudit.lean | tee track-g-any-block-factor-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackGArbitraryBlockFactorAxiomAudit.lean track-g-any-block-factor-axioms.log
