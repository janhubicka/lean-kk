name: KK Track E maximal prefix tests bounded by selected OLD suffix levels

on:
  pull_request:
    paths:
      - 'Kk/TrackESelectedTailOriginalBudget.lean'
      - 'Kk/TrackESelectedTailOriginalBudgetAxiomAudit.lean'
      - 'docs/track_e_selected_tail_source_budget_english_audit_20261122.md'
      - '.github/workflows/kk-track-e-selected-tail-original-budget.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-e-selTAILbudget-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile old-selected SUFFIX cardinal bound on physical original max tests
        run: lake build Kk.TrackESelectedTailOriginalBudget
      - name: Strict five-endpoint transitive-axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackESelectedTailOriginalBudgetAxiomAudit.lean | tee track-e-selTAILbudget-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackESelectedTailOriginalBudgetAxiomAudit.lean track-e-selTAILbudget-axioms.log
