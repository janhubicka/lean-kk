name: KK Track G construct full Kpt target finite index without target run

on:
  pull_request:
    paths:
      - 'Kk/TrackGConstructTargetIndexWithoutRun.lean'
      - 'Kk/TrackGConstructTargetIndexWithoutRunAxiomAudit.lean'
      - 'docs/track_g_construct_target_finite_index_without_run_english_audit_20261118.md'
      - '.github/workflows/kk-track-g-construct-target-index-no-run.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-g-construct-target-index-no-run-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile construct finite Kpt target index and test canonical Bad
        run: lake build Kk.TrackGConstructTargetIndexWithoutRun
      - name: Strict two-name standard-only transitive axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackGConstructTargetIndexWithoutRunAxiomAudit.lean | tee track-g-construct-target-index-no-run-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackGConstructTargetIndexWithoutRunAxiomAudit.lean track-g-construct-target-index-no-run-axioms.log
