name: KK Track F canonical full support
on:
  pull_request:
    paths:
      - 'Kk/TrackFCanonicalFullSupportBridge.lean'
      - 'Kk/TrackFCanonicalFullSupportBridgeAxiomAudit.lean'
      - 'docs/track_f_canonical_full_support_bridge_english_audit_20261119.md'
      - '.github/workflows/kk-track-f-canonical-full-support.yml'
  workflow_dispatch:
concurrency:
  group: kk-track-f-canonical-full-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  canonical-full-support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Build exact-to-full canonical support bridge
        run: lake build Kk.TrackFCanonicalFullSupportBridge
      - name: Strict three-theorem standard-only axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackFCanonicalFullSupportBridgeAxiomAudit.lean | tee track-f-canonical-full-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackFCanonicalFullSupportBridgeAxiomAudit.lean track-f-canonical-full-axioms.log
