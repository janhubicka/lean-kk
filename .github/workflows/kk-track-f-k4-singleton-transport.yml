name: KK Track F complete K4 singleton transport
on:
  pull_request:
    paths:
      - 'Kk/TrackFK4FullSingletonTransport.lean'
      - 'Kk/TrackFK4FullSingletonTransportAxiomAudit.lean'
      - 'docs/track_f_k4_full_singleton_transport_english_audit.md'
      - '.github/workflows/kk-track-f-k4-singleton-transport.yml'
  workflow_dispatch:
concurrency:
  group: kk-track-f-k4-singleton-transport-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  k4-singleton-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Build all K4 singleton source-target rank transport
        run: lake build Kk.TrackFK4FullSingletonTransport
      - name: Strict three-theorem standard-only axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackFK4FullSingletonTransportAxiomAudit.lean | tee track-f-k4-singleton-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackFK4FullSingletonTransportAxiomAudit.lean track-f-k4-singleton-axioms.log
