name: KK Track E actual new-root monotonicity and novelty gate

on:
  pull_request:
    paths:
      - 'Kk/ActualRunSeedMonotonicity.lean'
      - 'Kk/NewSourceEventWitness.lean'
      - 'Kk/NewRootIndexedNovelty.lean'
      - 'Kk/TrackENewRootAxiomAudit.lean'
      - 'docs/track_e_monotone_seed_growth_english_audit.md'
      - '.github/workflows/kk-track-e-new-root.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-e-new-root-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Explicitly compile actual new-root monotonicity and novel-cut witness
        run: lake build Kk.ActualRunSeedMonotonicity Kk.NewSourceEventWitness Kk.NewRootIndexedNovelty
      - name: Strict named transitive axioms
        run: |
          set -euo pipefail
          lake env lean Kk/TrackENewRootAxiomAudit.lean | tee track-e-new-root-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackENewRootAxiomAudit.lean track-e-new-root-axioms.log
