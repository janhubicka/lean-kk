name: KK Track G zero and odd exact Bad structural or bounded original interval trichotomy

on:
  pull_request:
    paths:
      - 'Kk/TrackGBoundedOriginalIntervalTrichotomy.lean'
      - 'Kk/TrackGBoundedOriginalIntervalTrichotomyAxiomAudit.lean'
      - 'docs/track_g_bounded_original_interval_trichotomy_english_audit_20261122.md'
      - '.github/workflows/kk-track-g-bounded-original-trichotomy.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-g-bounded-original-trichotomy-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile zero/odd physical Kpt exact factor Bad original interval trichotomy
        run: lake build Kk.TrackGBoundedOriginalIntervalTrichotomy
      - name: Strict two-name standard-only transitive axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackGBoundedOriginalIntervalTrichotomyAxiomAudit.lean | tee track-g-bounded-original-trichotomy-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackGBoundedOriginalIntervalTrichotomyAxiomAudit.lean track-g-bounded-original-trichotomy-axioms.log
