name: KK Track A non-top numerical-H generation height

on:
  pull_request:
    paths:
      - 'Kk/PartialNumericGenerationHeight.lean'
      - 'docs/partial_numeric_generation_height_english_audit.md'
      - '.github/workflows/kk-track-a-generation-height.yml'
  push:
    branches: [kk-track-a-partial-generation-height-20261115]
  workflow_dispatch:

concurrency:
  group: kk-track-a-generation-height-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-height-bound:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Restore Mathlib cache
        run: lake exe cache get
      - name: Independent exact finite sharp capacity regression
        run: python3 scripts/check_partial_numeric_old_age.py
      - name: Explicitly compile earlier partial common-pool/capacity interfaces
        run: |
          lake build Kk.PartialNumericOldColumns
          lake build Kk.PartialNumericCommonPool
          lake build Kk.PartialNumericCapacityBounds
      - name: Explicitly compile physical non-top generation height proof
        run: lake build Kk.PartialNumericGenerationHeight
      - name: Strict fully qualified standard-only named axiom check
        run: |
          set -euo pipefail
          python3 scripts/check_axiom_report.py --self-test
          lake env lean Kk/PartialNumericGenerationHeight.lean | tee height-axioms.log
          python3 scripts/check_axiom_report.py Kk/PartialNumericGenerationHeight.lean height-axioms.log
      - name: Full repository Lake build
        run: lake build
