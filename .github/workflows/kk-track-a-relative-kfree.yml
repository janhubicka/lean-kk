name: KK Track A finite relative tagged K-free target

on:
  pull_request:
    paths:
      - 'Kk/FiniteTaggedRelativeKFree.lean'
      - 'docs/finite_tagged_relative_kfree_english_audit.md'
      - '.github/workflows/kk-track-a-relative-kfree.yml'
  push:
    branches: [kk-track-a-relative-universal-gluing-20261114]
  workflow_dispatch:

concurrency:
  group: kk-track-a-relative-kfree-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-relative-kfree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Restore Mathlib cache
        run: lake exe cache get
      - name: Explicitly compile relative finite K-free gluing module
        run: lake build Kk.FiniteTaggedRelativeKFree
      - name: Strict seven-declaration transitive axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/FiniteTaggedRelativeKFree.lean | tee relative-kfree-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/FiniteTaggedRelativeKFree.lean relative-kfree-axioms.log
      - name: Full existing repository build
        run: lake build
