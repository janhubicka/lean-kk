name: KK Track C coherent Kpt index composition

on:
  pull_request:
    paths:
      - 'Kk/CoherentKptIndexComposition.lean'
      - 'Kk/TrackCCoherentIndexCompositionAxiomAudit.lean'
      - 'docs/track_c_coherent_index_composition_english_audit.md'
      - '.github/workflows/kk-track-c-index-compose.yml'
  workflow_dispatch:

jobs:
  index-compose-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib cache
        run: lake exe cache get
      - name: Compile coherent Kpt index composition
        run: lake build Kk.CoherentKptIndexComposition
      - name: Strict five-declaration standard-only axiom audit
        run: |
          set -euo pipefail
          lake env lean Kk/TrackCCoherentIndexCompositionAxiomAudit.lean | tee track-c-coherent-compose-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackCCoherentIndexCompositionAxiomAudit.lean track-c-coherent-compose-axioms.log
