name: KK Track F pairwise target separation
on:
  pull_request:
    paths:
      - 'Kk/TrackFPairwiseTargetSeparation.lean'
      - 'Kk/TrackFPairwiseTargetSeparationAxiomAudit.lean'
      - 'docs/track_f_pairwise_target_separation_english_audit_20261120.md'
      - '.github/workflows/kk-track-f-pairwise-target-separation.yml'
  workflow_dispatch:
concurrency:
  group: kk-track-f-target-separation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  pairwise-separation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Build source-old-bit target-prefix injectivity
        run: lake build Kk.TrackFPairwiseTargetSeparation
      - name: Strict four-theorem standard-only axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackFPairwiseTargetSeparationAxiomAudit.lean | tee track-f-target-separation-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackFPairwiseTargetSeparationAxiomAudit.lean track-f-target-separation-axioms.log
