name: KK Track F full checkpoint survivor numeric age
on:
  pull_request:
    paths:
      - 'Kk/TrackFRealTargetSurvivorNumericEndpoint.lean'
      - 'Kk/TrackFRealTargetSurvivorNumericEndpointAxiomAudit.lean'
      - 'docs/track_f_numeric_survivor_endpoint_from_full_checkpoint_english_audit_20261122.md'
      - '.github/workflows/kk-track-f-full-checkpoint-survivor-age.yml'
  workflow_dispatch:
concurrency:
  group: kk-track-f-target-survivor-numeric-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  numeric-survivors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Build actual old/later target survivor age endpoint theorem
        run: lake build Kk.TrackFRealTargetSurvivorNumericEndpoint
      - name: Strict named standard-only axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackFRealTargetSurvivorNumericEndpointAxiomAudit.lean | tee track-f-target-endpoint-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackFRealTargetSurvivorNumericEndpointAxiomAudit.lean track-f-target-endpoint-axioms.log
