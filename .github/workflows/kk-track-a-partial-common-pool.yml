name: KK Track A actual partial common-neighbour pool

on:
  pull_request:
    paths:
      - 'Kk/PartialNumericCommonPool.lean'
      - 'docs/partial_numeric_common_pool_english_audit.md'
      - '.github/workflows/kk-track-a-partial-common-pool.yml'
  push:
    branches: [kk-track-a-partial-common-pool-20261115]
  workflow_dispatch:

concurrency:
  group: kk-track-a-partial-common-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-partial-common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Restore Mathlib cache
        run: lake exe cache get
      - name: Independently check 26,880 exact partial old-pool/capacity cases
        run: python3 scripts/check_partial_numeric_old_age.py
      - name: Explicitly compile underlying partial old-column module
        run: lake build Kk.PartialNumericOldColumns
      - name: Explicitly compile exact actual common-neighbour pool
        run: lake build Kk.PartialNumericCommonPool
      - name: Exact fully-qualified standard-only named axiom audit
        run: |
          set -euo pipefail
          python3 scripts/check_axiom_report.py --self-test
          lake env lean Kk/PartialNumericCommonPool.lean | tee partial-common-axioms.log
          python3 scripts/check_axiom_report.py Kk/PartialNumericCommonPool.lean partial-common-axioms.log
      - name: Full repository Lean build
        run: lake build
