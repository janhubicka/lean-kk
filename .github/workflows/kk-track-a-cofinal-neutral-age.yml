name: KK Track A cofinal neutral old-column age

on:
  pull_request:
    paths:
      - 'Kk/CofinalNeutralOldColumnAge.lean'
      - 'docs/cofinal_neutral_old_column_age_english_audit.md'
      - '.github/workflows/kk-track-a-cofinal-neutral-age.yml'
  push:
    branches: [kk-track-a-cofinal-neutral-padding-20261114]
  workflow_dispatch:

concurrency:
  group: kk-track-a-cofinal-neutral-age-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-cofinal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Restore Mathlib cache
        run: lake exe cache get
      - name: Explicitly compile cofinal neutral age and numeric H future
        run: lake build Kk.CofinalNeutralOldColumnAge
      - name: Strict named transitive axiom audit
        run: |
          set -euo pipefail
          lake env lean Kk/CofinalNeutralOldColumnAge.lean | tee cofinal-neutral-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/CofinalNeutralOldColumnAge.lean cofinal-neutral-axioms.log
      - name: Full repository build
        run: lake build
