name: KK Track A uniform finite numeric top age

on:
  pull_request:
    paths:
      - 'Kk/FiniteUniformNumericTopAge.lean'
      - 'docs/finite_uniform_numeric_top_english_audit.md'
      - '.github/workflows/kk-track-a-numeric-top-age.yml'
  push:
    branches: [kk-track-a-uniform-numeric-top-20261114]
  workflow_dispatch:

concurrency:
  group: kk-track-a-numeric-top-age-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-numeric-top:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Restore Mathlib cache
        run: lake exe cache get
      - name: Compile exact Henson-to-numerical-H universal top profile
        run: lake build Kk.FiniteUniformNumericTopAge
      - name: Strict named standard-only axiom audit
        run: |
          set -euo pipefail
          lake env lean Kk/FiniteUniformNumericTopAge.lean | tee uniform-numeric-top-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/FiniteUniformNumericTopAge.lean uniform-numeric-top-axioms.log
      - name: Full existing repository build
        run: lake build
