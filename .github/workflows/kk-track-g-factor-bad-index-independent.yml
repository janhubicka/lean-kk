name: KK Track G physical exact factor Bad independent of target index, finite H+ application

on:
  pull_request:
    paths:
      - 'Kk/TrackGFactorBadIndexIndependent.lean'
      - 'Kk/TrackGFactorBadIndexIndependentAxiomAudit.lean'
      - 'docs/track_g_factor_bad_index_independence_english_audit_20261121.md'
      - '.github/workflows/kk-track-g-factor-bad-index-independent.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-g-factor-bad-index-independent-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile index-independent exact physical Kpt factor Bad support
        run: lake build Kk.TrackGFactorBadIndexIndependent
      - name: Strict three-name standard-only transitive axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackGFactorBadIndexIndependentAxiomAudit.lean | tee track-g-factor-bad-index-independent-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackGFactorBadIndexIndependentAxiomAudit.lean track-g-factor-bad-index-independent-axioms.log
