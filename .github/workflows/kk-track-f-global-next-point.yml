name: KK Track F global sorted finite graph next-point realization
on:
  pull_request:
    paths:
      - 'Kk/TrackFGlobalLabelledNextSafety.lean'
      - 'Kk/TrackFGlobalLabelledNextSafetyAxiomAudit.lean'
      - 'docs/track_f_global_labelled_next_safety_english_audit.md'
      - '.github/workflows/kk-track-f-global-next-point.yml'
  workflow_dispatch:
concurrency:
  group: kk-track-f-global-next-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  global-next-point:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Build global sorted graph next-point realization
        run: lake build Kk.TrackFGlobalLabelledNextSafety
      - name: Strict three-theorem standard-only axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackFGlobalLabelledNextSafetyAxiomAudit.lean | tee track-f-global-next-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackFGlobalLabelledNextSafetyAxiomAudit.lean track-f-global-next-axioms.log
