name: KK Track D — full even-real I1 excluded by actual stage zero column

on:
  pull_request:
    paths:
      - 'Kk/TrackDEvenRealNoI1.lean'
      - 'scripts/check_axioms_track_d_even_real_no_i1.lean'
      - '.github/workflows/track-d-even-real-no-i1.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-d-even-real-no-i1-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  even-real-no-i1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib cache
        run: lake exe cache get
      - name: Build exact full even-real no-I1 stage theorem
        run: lake build Kk.TrackDEvenRealNoI1
      - name: Strict source-name transitive axiom gate
        run: |
          set -euo pipefail
          lake env lean scripts/check_axioms_track_d_even_real_no_i1.lean | tee track_d_even_real_no_i1.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py scripts/check_axioms_track_d_even_real_no_i1.lean track_d_even_real_no_i1.log
