name: Track F pair capacity

on:
  pull_request:
    paths:
      - 'Kk/TrackFPairCapacity.lean'
      - 'Kk/TrackFSingletonCapacity.lean'
      - 'Kk/TrackFPairCapacityTrue.lean'
      - 'docs/track_f_pair_capacity_english_audit.md'
      - 'scripts/track_f_pair_axioms.lean'
      - '.github/workflows/track-f-pair-lean.yml'
  workflow_dispatch:

jobs:
  pair-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Mathlib cache
        run: lake exe cache get
      - name: Compile two-sort theorem
        run: lake build Kk.TrackFPairCapacity Kk.TrackFSingletonCapacity Kk.TrackFPairCapacityTrue
      - name: Verify eight named theorem axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean scripts/track_f_pair_axioms.lean | tee pair-axioms.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path("pair-axioms.log").read_text()
          expected=[
            "Kk.trackFPair_mass_first",
            "Kk.trackFPair_mass_second",
            "Kk.trackFPair_mass_both",
            "Kk.trackFPair_canonical_capacity",
            "Kk.trackFCanonical_singleton_eq_raw",
            "Kk.trackFPair_canonical_true_singletons",
            "Kk.trackFPair_word_capacity",
            "Kk.trackFPair_passing_arithmetic",
          ]
          allowed={"propext","Classical.choice","Quot.sound"}
          for name in expected:
              m=re.search(r"(?m)^'"+re.escape(name)+r"' depends on axioms: \[([^\]]*)\]",lines)
              if not m:
                  raise SystemExit("FAIL missing report: "+name)
              got={x.strip() for x in m.group(1).split(",") if x.strip()}
              if not got<=allowed:
                  raise SystemExit(f"FAIL {name}: {sorted(got-allowed)}")
              print(f"PASS {name}: {sorted(got)}")
          PY
