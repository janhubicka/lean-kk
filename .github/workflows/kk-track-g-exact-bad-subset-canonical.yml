name: KK Track G exact factor Bad support subset old E54 no-novelty Bad support

on:
  pull_request:
    paths:
      - 'Kk/TrackGExactBadSubsetCanonical.lean'
      - 'Kk/TrackGExactBadSubsetCanonicalAxiomAudit.lean'
      - 'docs/track_g_exact_bad_subset_canonical_english_audit_20261120.md'
      - '.github/workflows/kk-track-g-exact-bad-subset-canonical.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-g-exact-bad-subset-canonical-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile exact Kpt factor Bad subset canonical E54 no-novelty Bad
        run: lake build Kk.TrackGExactBadSubsetCanonical
      - name: Strict two-name standard-only transitive axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackGExactBadSubsetCanonicalAxiomAudit.lean | tee track-g-exact-bad-subset-canonical-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackGExactBadSubsetCanonicalAxiomAudit.lean track-g-exact-bad-subset-canonical-axioms.log
