name: KK Track G zero graph column factor mismatch forces missing old Kpt socle

on:
  pull_request:
    paths:
      - 'Kk/TrackGZeroColumnFactorMismatchSocle.lean'
      - 'Kk/TrackGZeroColumnFactorMismatchSocleAxiomAudit.lean'
      - 'docs/track_g_zero_column_factor_mismatch_no_old_socle_english_audit_20261121.md'
      - '.github/workflows/kk-track-g-zero-column-factor-mismatch.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-g-zero-column-factor-mismatch-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile zero-stage old Kpt socle obstruction for actual factor mismatch
        run: lake build Kk.TrackGZeroColumnFactorMismatchSocle
      - name: Strict one-name standard-only transitive axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackGZeroColumnFactorMismatchSocleAxiomAudit.lean | tee track-g-zero-column-factor-mismatch-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackGZeroColumnFactorMismatchSocleAxiomAudit.lean track-g-zero-column-factor-mismatch-axioms.log
