name: KK Track A combined physical canonical cover

on:
  pull_request:
    paths:
      - 'Kk/NumericPrefixCanonicalCover.lean'
      - 'docs/numeric_prefix_canonical_cover_english_audit.md'
      - '.github/workflows/kk-track-a-canonical-cover.yml'
  push:
    branches: [kk-track-a-combined-physical-age-20261114]
  workflow_dispatch:

concurrency:
  group: kk-track-a-canonical-cover-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-physical-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib cache
        run: lake exe cache get
      - name: Explicitly compile complete physical-cover module
        run: lake build Kk.NumericPrefixCanonicalCover
      - name: Strict named transitive axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/NumericPrefixCanonicalCover.lean | tee physical-cover-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/NumericPrefixCanonicalCover.lean physical-cover-axioms.log
      - name: Full existing repository build
        run: lake build
