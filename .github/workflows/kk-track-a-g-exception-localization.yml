name: KK Track A/G exceptional full-Kpt selected-level localization

on:
  pull_request:
    paths:
      - 'Kk/TrackAGExceptionSelected.lean'
      - 'Kk/TrackAGExceptionSelectedAxiomAudit.lean'
      - 'Kk.lean'
      - 'scripts/check_track_a_g_exception_scan.py'
      - 'docs/track_a_g_exception_localization_english_audit_20261121.md'
      - '.github/workflows/kk-track-a-g-exception-localization.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-a-g-exception-localization-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Independent finite recursion regression
        run: python3 scripts/check_track_a_g_exception_scan.py
      - name: Compile exception localization
        run: lake build Kk.TrackAGExceptionSelected
      - name: Strict 5-name standard-only transitive axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackAGExceptionSelectedAxiomAudit.lean | tee track-a-g-exception-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackAGExceptionSelectedAxiomAudit.lean track-a-g-exception-axioms.log
