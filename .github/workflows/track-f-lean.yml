name: Track F diary correspondence

on:
  pull_request:
    paths:
      - 'Kk/DiaryCoverColumn.lean'
      - 'Kk/TrackFLabelledFibre.lean'
      - 'Kk/TrackFCodingColumn.lean'
      - 'Kk/TrackFRawCoverColumn.lean'
      - 'Kk/TrackFCoverEssentialSupport.lean'
      - 'Kk/TrackFCoverOneStep.lean'
      - 'Kk/TrackFCoverSupportValues.lean'
      - 'scripts/track_f_axioms.lean'
      - 'docs/track_f_cover_column_english_audit.md'
      - 'docs/track_f_labelled_fibre_english_audit.md'
      - 'docs/track_f_coding_column_english_audit.md'
      - 'docs/track_f_raw_cover_column_english_audit.md'
      - 'docs/track_f_cover_essential_support_english_audit.md'
      - 'docs/track_f_cover_one_step_english_audit.md'
      - 'docs/track_f_consecutive_part3_english_audit.md'
      - '.github/workflows/track-f-lean.yml'
  workflow_dispatch:

jobs:
  exact-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore existing Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Restore Mathlib compilation cache
        run: lake exe cache get
      - name: Compile new Track F module explicitly
        run: lake build Kk.DiaryCoverColumn Kk.TrackFLabelledFibre Kk.TrackFCodingColumn Kk.TrackFRawCoverColumn Kk.TrackFCoverEssentialSupport Kk.TrackFCoverOneStep Kk.TrackFCoverSupportValues
      - name: Check only standard Lean axioms in all twenty-one endpoints
        shell: bash
        run: |
          set -euo pipefail
          lake env lean scripts/track_f_axioms.lean | tee track-f-axioms.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines = Path("track-f-axioms.log").read_text()
          expected = [
            "Kk.diaryCoverColumnRaw_le_upper",
            "Kk.diaryCoverColumnCanonical_exact",
            "Kk.diaryCoverColumn_feasible_iff_lower",
            "Kk.trackF_card_labelled_diaries",
            "Kk.trackFCodingRaw_le_original",
            "Kk.trackFCodingColumn_canonical_eq",
            "Kk.trackFCodingColumn_feasible_iff",
            "Kk.trackFCodingRaw_witness_iff",
            "Kk.trackFCanonical_eq_of_feasible_iff",
            "Kk.trackFCanonical_add_cap_congr",
            "Kk.trackFRawCoverColumn_exact",
            "Kk.trackFRawCoverColumn_feasible_iff_lower",
            "Kk.trackFCover_exists_minimal_changed",
            "Kk.trackFCover_unique_minimal_changed",
            "Kk.trackF_integerWitness_drop_one",
            "Kk.trackFCover_drop_one_at_changed",
            "Kk.trackFCover_drop_at_most_one",
            "Kk.trackFCover_single_support_canonical",
            "Kk.trackFCover_changed_values_of_containment",
            "Kk.trackFCover_essential_contained_in_changed",
            "Kk.trackFCover_all_changed_upper_eq_essential",
          ]
          permitted = {"propext", "Classical.choice", "Quot.sound"}
          for name in expected:
              m = re.search(r"(?m)^\x27" + re.escape(name) + r"\x27 depends on axioms: \[([^\]]*)\]", lines)
              if not m:
                  raise SystemExit("FAIL: missing named axiom report for " + name)
              axioms = {x.strip() for x in m.group(1).split(",") if x.strip()}
              forbidden = axioms - permitted
              if forbidden:
                  raise SystemExit(f"FAIL: {name} uses unexpected axioms {sorted(forbidden)}")
              print(f"PASS: {name}: {sorted(axioms)}")
          PY
