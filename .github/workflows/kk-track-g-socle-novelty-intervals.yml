name: KK Track G old-socle novelty intervals and zero-stage factor Bad carrier

on:
  pull_request:
    paths:
      - 'Kk/TrackGSocleNoveltyIntervals.lean'
      - 'Kk/TrackGSocleNoveltyIntervalsAxiomAudit.lean'
      - 'docs/track_g_old_socle_novelty_interval_english_audit_20261122.md'
      - '.github/workflows/kk-track-g-socle-novelty-intervals.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-g-socle-novelty-intervals-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile old-socle novelty interval and finite-index zero-stage exact Bad carrier
        run: lake build Kk.TrackGSocleNoveltyIntervals
      - name: Strict four-name standard-only transitive axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackGSocleNoveltyIntervalsAxiomAudit.lean | tee track-g-socle-novelty-intervals-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackGSocleNoveltyIntervalsAxiomAudit.lean track-g-socle-novelty-intervals-axioms.log
