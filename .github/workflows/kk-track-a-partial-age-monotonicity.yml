name: KK Track A physical partial old-age monotonicity

on:
  pull_request:
    paths:
      - 'Kk/PartialNumericAgeMonotonicity.lean'
      - 'docs/partial_numeric_age_monotonicity_english_audit.md'
      - '.github/workflows/kk-track-a-partial-age-monotonicity.yml'
  push:
    branches: [kk-track-a-partial-age-monotonicity-20261115]
  workflow_dispatch:

concurrency:
  group: kk-track-a-partial-age-monotone-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-partial-age:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Restore Mathlib cache
        run: lake exe cache get
      - name: Explicitly compile partial old-column source
        run: lake build Kk.PartialNumericOldColumns
      - name: Explicitly compile partial common-neighbour pool
        run: lake build Kk.PartialNumericCommonPool
      - name: Explicitly compile partial old-age monotonicity
        run: lake build Kk.PartialNumericAgeMonotonicity
      - name: Strict exact qualified standard-only transitive axiom audit
        run: |
          set -euo pipefail
          python3 scripts/check_axiom_report.py --self-test
          lake env lean Kk/PartialNumericAgeMonotonicity.lean | tee partial-age-axioms.log
          python3 scripts/check_axiom_report.py Kk/PartialNumericAgeMonotonicity.lean partial-age-axioms.log
      - name: Complete repository Lean build
        run: lake build
