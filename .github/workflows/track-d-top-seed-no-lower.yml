name: KK Track D — top seeds avoid all positive lower-real cuts

on:
  pull_request:
    paths:
      - 'Kk/TrackDTopSeedNoLowerReal.lean'
      - 'scripts/check_axioms_track_d_top_seed_no_lower.lean'
      - '.github/workflows/track-d-top-seed-no-lower.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-d-top-seed-no-lower-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  top-seed-no-lower:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib cache
        run: lake exe cache get
      - name: Build true top seed exclusion through generation zero
        run: lake build Kk.TrackDTopSeedNoLowerReal
      - name: Strict one-theorem transitive axiom gate
        run: |
          set -euo pipefail
          lake env lean scripts/check_axioms_track_d_top_seed_no_lower.lean | tee track_d_top_seed_no_lower.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py scripts/check_axioms_track_d_top_seed_no_lower.lean track_d_top_seed_no_lower.log
