name: KK Track E physical dependent Kpt parameter traces and Lplus source reconstruction

on:
  pull_request:
    paths:
      - 'Kk/TrackEPhysicalParameterTrace.lean'
      - 'Kk/TrackEPhysicalParameterTraceAxiomAudit.lean'
      - 'docs/track_e_physical_param_trace_english_audit.md'
      - '.github/workflows/kk-track-e-physical-param-trace.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-e-paramtrace-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile physical indexed dependent parameter trace reconstruction
        run: lake build Kk.TrackEPhysicalParameterTrace
      - name: Strict three-endpoint transitive-axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackEPhysicalParameterTraceAxiomAudit.lean | tee track-e-paramtrace-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackEPhysicalParameterTraceAxiomAudit.lean track-e-paramtrace-axioms.log
