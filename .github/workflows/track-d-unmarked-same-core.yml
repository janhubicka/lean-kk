name: KK Track D — unmarked original inside SAME forbidden clique

on:
  pull_request:
    paths:
      - 'Kk/B3UnmarkedInsideSameCore.lean'
      - 'scripts/check_axioms_unmarked_same_core.lean'
      - '.github/workflows/track-d-unmarked-same-core.yml'
  workflow_dispatch:

concurrency:
  group: kk-unmarked-same-core-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  unmarked-same-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile same-clique genuinely unmarked original theorem
        run: lake build Kk.B3UnmarkedInsideSameCore
      - name: Exact strict transitive-axiom gate
        run: |
          set -euo pipefail
          lake env lean scripts/check_axioms_unmarked_same_core.lean | tee unmarked_same_core_axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py scripts/check_axioms_unmarked_same_core.lean unmarked_same_core_axioms.log
