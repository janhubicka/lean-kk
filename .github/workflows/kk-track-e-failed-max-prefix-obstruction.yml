name: KK Track E bounded failed original versus outside-safe Kpt source obstruction

on:
  pull_request:
    paths:
      - 'Kk/TrackEFailedMaxPrefixObstruction.lean'
      - 'Kk/TrackEFailedMaxPrefixObstructionAxiomAudit.lean'
      - 'docs/track_e_failed_original_or_offsafe_obstruction_english_audit_20261122.md'
      - '.github/workflows/kk-track-e-failed-max-prefix-obstruction.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-e-obstruct-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile physical failed original or outside-safe source obstruction dichotomy
        run: lake build Kk.TrackEFailedMaxPrefixObstruction
      - name: Strict five-endpoint transitive-axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackEFailedMaxPrefixObstructionAxiomAudit.lean | tee track-e-obstruct-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackEFailedMaxPrefixObstructionAxiomAudit.lean track-e-obstruct-axioms.log
