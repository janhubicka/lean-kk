name: KK Track E residual new final versus early old active Kpt source cases

on:
  pull_request:
    paths:
      - 'Kk/TrackENumericResidualTwoClass.lean'
      - 'Kk/TrackENumericResidualTwoClassAxiomAudit.lean'
      - 'docs/track_e_numeric_residual_two_class_english_audit.md'
      - '.github/workflows/kk-track-e-numeric-residual-two-class.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-e-tworesidual-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile actual numerical H residual new-final and early-old source classification
        run: lake build Kk.TrackENumericResidualTwoClass
      - name: Strict two-endpoint transitive-axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackENumericResidualTwoClassAxiomAudit.lean | tee track-e-tworesidual-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackENumericResidualTwoClassAxiomAudit.lean track-e-tworesidual-axioms.log
