name: KK Track E two physical safe cut classes with ONE maximal old-prefix whole-run

on:
  pull_request:
    paths:
      - 'Kk/TrackETwoSafeClassesOriginalMaxWholeRun.lean'
      - 'Kk/TrackETwoSafeClassesOriginalMaxWholeRunAxiomAudit.lean'
      - 'docs/track_e_two_safe_cut_classes_whole_run_english_audit_20261121.md'
      - '.github/workflows/kk-track-e-two-safe-classes-whole-run.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-e-twosafe-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile combined isolated dummy and safe odd source whole-run I/F transport
        run: lake build Kk.TrackETwoSafeClassesOriginalMaxWholeRun
      - name: Strict two-endpoint transitive-axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackETwoSafeClassesOriginalMaxWholeRunAxiomAudit.lean | tee track-e-twosafe-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackETwoSafeClassesOriginalMaxWholeRunAxiomAudit.lean track-e-twosafe-axioms.log
