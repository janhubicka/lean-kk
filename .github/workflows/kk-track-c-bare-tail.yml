name: KK Track C bare-root old selected tail

on:
  pull_request:
    paths:
      - 'Kk/BareRootOldTailRetention.lean'
      - 'Kk/TrackCBareTailAxiomAudit.lean'
      - 'docs/track_c_bare_old_tail_english_audit.md'
      - '.github/workflows/kk-track-c-bare-tail.yml'
  workflow_dispatch:

jobs:
  bare-tail-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib cache
        run: lake exe cache get
      - name: Compile Track C tail lemma
        run: lake build Kk.BareRootOldTailRetention
      - name: Exact two-theorem standard-only axiom audit
        run: |
          set -euo pipefail
          lake env lean Kk/TrackCBareTailAxiomAudit.lean | tee track-c-tail-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackCBareTailAxiomAudit.lean track-c-tail-axioms.log
