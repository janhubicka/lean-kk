name: KK Track F coloured rank-large Henson fans
on:
  pull_request:
    paths:
      - 'Kk/TrackFColouredRankLargeFan.lean'
      - 'Kk/TrackFColouredRankLargeFanAxiomAudit.lean'
      - 'docs/track_f_coloured_fan_english_audit.md'
      - '.github/workflows/kk-track-f-coloured-fan.yml'
  workflow_dispatch:
concurrency:
  group: kk-track-f-coloured-fan-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  coloured-fan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Build coloured rank-large fan
        run: lake build Kk.TrackFColouredRankLargeFan
      - name: Strict two-theorem axiom audit
        run: |
          set -euo pipefail
          lake env lean Kk/TrackFColouredRankLargeFanAxiomAudit.lean | tee track-f-coloured-fan-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackFColouredRankLargeFanAxiomAudit.lean track-f-coloured-fan-axioms.log
