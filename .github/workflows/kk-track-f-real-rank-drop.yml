name: KK Track F genuine Henson type rank-drop

on:
  pull_request:
    paths:
      - 'Kk/TrackFRealHensonRankDrop.lean'
      - 'Kk/TrackFRealHensonRankDropAxiomAudit.lean'
      - 'docs/track_f_real_henson_rank_drop_english_audit.md'
      - 'scripts/verify_track_f_real_rank_drop.py'
      - '.github/workflows/kk-track-f-real-rank-drop.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-f-real-rank-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  real-henson-rank-drop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Independent exhaustive finite-graph rank-drop regression
        run: python3 scripts/verify_track_f_real_rank_drop.py
      - name: Build real Henson rank-drop proof
        run: lake build Kk.TrackFRealHensonRankDrop
      - name: Strict three-theorem transitive axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackFRealHensonRankDropAxiomAudit.lean | tee track-f-real-rank-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackFRealHensonRankDropAxiomAudit.lean track-f-real-rank-axioms.log
