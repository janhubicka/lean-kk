name: KK Track A K4 raw-only canonical redundancy counterexample

on:
  pull_request:
    paths:
      - 'docs/k4_raw_event_canonical_redundancy_english_audit.md'
      - 'scripts/check_k4_raw_event_canonical_redundancy.py'
      - 'docs/k4_physical_canonical_noncover_english_audit.md'
      - 'scripts/check_k4_physical_canonical_noncover.py'
      - '.github/workflows/kk-track-a-k4-raw-redundancy.yml'
  push:
    branches: [kk-track-a-raw-redundancy-k4-example-20261117]
  workflow_dispatch:

concurrency:
  group: kk-track-a-k4-raw-redundancy-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  independently-check-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Independent literal numeric H K4-free graph and canonical raw-event check
        run: python3 scripts/check_k4_raw_event_canonical_redundancy.py
      - name: Independently check five-vertex K4-free canonical non-cover with intermediate age
        run: python3 scripts/check_k4_physical_canonical_noncover.py
