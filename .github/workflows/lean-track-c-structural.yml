name: Lean Track C full structural cut classifier

on:
  push:
    branches: [kk-track-c-structural-cut-classifier-20261114]
    paths:
      - 'Kk/NumericHStructuralCutClassifier.lean'
      - 'docs/track_c_structural_cut_classifier_english_audit.md'
      - '.github/workflows/lean-track-c-structural.yml'
  pull_request:
    paths:
      - 'Kk/NumericHStructuralCutClassifier.lean'
      - 'docs/track_c_structural_cut_classifier_english_audit.md'
      - '.github/workflows/lean-track-c-structural.yml'
  workflow_dispatch:

concurrency:
  group: track-c-structural-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  full-structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib cache
        run: lake exe cache get
      - name: Compile real I1/I2 full structural classifier
        run: lake build Kk.NumericHStructuralCutClassifier
      - name: Audit three exact standard-only theorem reports
        run: |
          set -euo pipefail
          lake env lean Kk/NumericHStructuralCutClassifier.lean | tee track-c-structural.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/NumericHStructuralCutClassifier.lean track-c-structural.log
