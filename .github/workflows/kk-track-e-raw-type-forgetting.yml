name: KK Track E raw Kpt distinguished type vertex forgotten by ordinary Gplus code

on:
  pull_request:
    paths:
      - 'Kk/TrackERawTypeVertexForgetting.lean'
      - 'Kk/TrackERawTypeVertexForgettingAxiomAudit.lean'
      - 'docs/track_e_raw_type_vertex_forgetting_counterexample_english.md'
      - '.github/workflows/kk-track-e-raw-type-forgetting.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-e-rawforget-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile positive-size raw Kpt type-vertex forgetting regression
        run: lake build Kk.TrackERawTypeVertexForgetting
      - name: Strict three-endpoint transitive-axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackERawTypeVertexForgettingAxiomAudit.lean | tee track-e-rawforget-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackERawTypeVertexForgettingAxiomAudit.lean track-e-rawforget-axioms.log
