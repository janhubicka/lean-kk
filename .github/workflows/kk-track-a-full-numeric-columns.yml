name: KK Track A uniform numerical H old and gap columns

on:
  pull_request:
    paths:
      - 'Kk/FiniteUniformNumericColumns.lean'
      - 'docs/finite_uniform_numeric_columns_english_audit.md'
      - '.github/workflows/kk-track-a-full-numeric-columns.yml'
  push:
    branches: [kk-track-a-uniform-full-numeric-columns-20261114]
  workflow_dispatch:

concurrency:
  group: kk-track-a-full-numeric-columns-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-full-numeric-columns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Restore Mathlib cache
        run: lake exe cache get
      - name: Compile exact all-generation old/gap numeric columns
        run: lake build Kk.FiniteUniformNumericColumns
      - name: Strict standard-only named axiom audit
        run: |
          set -euo pipefail
          lake env lean Kk/FiniteUniformNumericColumns.lean | tee numeric-columns-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/FiniteUniformNumericColumns.lean numeric-columns-axioms.log
      - name: Full existing repository build
        run: lake build
