name: KK Track D — old generation-zero full Kpt source separation

on:
  pull_request:
    paths:
      - 'Kk/K4GenerationZeroSourceSeparator.lean'
      - 'scripts/check_axioms_track_d_old_zero_separator.lean'
      - '.github/workflows/track-d-old-zero-separator.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-d-old-zero-separator-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  old-zero-separator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib cache
        run: lake exe cache get
      - name: Build genuine generation-zero type separator
        run: lake build Kk.K4GenerationZeroSourceSeparator
      - name: Strict two-theorem standard-axiom gate
        run: |
          set -euo pipefail
          lake env lean scripts/check_axioms_track_d_old_zero_separator.lean | tee track_d_old_zero_separator.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py scripts/check_axioms_track_d_old_zero_separator.lean track_d_old_zero_separator.log
