name: KK Track E finite Kpt seed root-original pool compression

on:
  pull_request:
    paths:
      - 'Kk/TrackEFiniteSeedRootOriginalCompression.lean'
      - 'Kk/TrackEFiniteSeedRootOriginalCompressionAxiomAudit.lean'
      - 'docs/track_e_finite_seed_minimal_root_original_pool_english_audit_20261122.md'
      - '.github/workflows/kk-track-e-finite-seed-root-compression.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-e-rootcompress-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile finite actual Kpt seeds choose small physical original root pool
        run: lake build Kk.TrackEFiniteSeedRootOriginalCompression
      - name: Strict two-endpoint transitive-axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackEFiniteSeedRootOriginalCompressionAxiomAudit.lean | tee track-e-rootcompress-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackEFiniteSeedRootOriginalCompressionAxiomAudit.lean track-e-rootcompress-axioms.log
