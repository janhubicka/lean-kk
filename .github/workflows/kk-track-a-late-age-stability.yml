name: KK Track A stable late partial numerical-H ordinary-L age

on:
  pull_request:
    paths:
      - 'Kk/PartialNumericLateAgeStability.lean'
      - 'docs/partial_numeric_late_age_stability_english_audit.md'
      - '.github/workflows/kk-track-a-late-age-stability.yml'
  push:
    branches: [kk-track-a-partial-late-tail-stability-20261117]
  workflow_dispatch:

concurrency:
  group: kk-track-a-late-age-stability-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  late-stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Restore Mathlib cache
        run: lake exe cache get
      - name: Independent 197,120-case actual raw support event regression
        run: python3 scripts/check_partial_numeric_raw_support_events.py
      - name: Explicit build of verified numerical raw support event theorem
        run: lake build Kk.PartialNumericRawSupportEvents
      - name: Explicit build of late partial raw/canonical/feasible age stability
        run: lake build Kk.PartialNumericLateAgeStability
      - name: Strict fully qualified named standard-only axiom audit
        run: |
          set -euo pipefail
          python3 scripts/check_axiom_report.py --self-test
          lake env lean Kk/PartialNumericLateAgeStability.lean | tee late-age-axioms.log
          python3 scripts/check_axiom_report.py Kk/PartialNumericLateAgeStability.lean late-age-axioms.log
      - name: Full repository Lake build
        run: lake build
