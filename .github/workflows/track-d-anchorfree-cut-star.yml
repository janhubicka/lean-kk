name: Track D — anchor-free cut-star B3

on:
  pull_request:
    paths:
      - 'Kk/B3CutStarNormalForm.lean'
      - 'scripts/check_axioms_cut_star.lean'
      - '.github/workflows/track-d-anchorfree-cut-star.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-d-anchorfree-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  anchorfree-cut-star:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned successor-library and Mathlib dependencies
        run: lake update
      - name: Restore Mathlib cache
        run: lake exe cache get
      - name: Compile the NEW proof module explicitly
        run: lake build Kk.B3CutStarNormalForm
      - name: Exact named transitive-axiom gate (standard only)
        run: |
          set -euo pipefail
          lake env lean scripts/check_axioms_cut_star.lean | tee cut_star_axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py scripts/check_axioms_cut_star.lean cut_star_axioms.log
