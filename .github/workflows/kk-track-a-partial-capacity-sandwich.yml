name: KK Track A actual partial clique-capacity sandwich

on:
  pull_request:
    paths:
      - 'Kk/PartialNumericCapacityBounds.lean'
      - 'docs/partial_numeric_capacity_bounds_english_audit.md'
      - '.github/workflows/kk-track-a-partial-capacity-sandwich.yml'
  push:
    branches: [kk-track-a-partial-capacity-sandwich-20261115]
  workflow_dispatch:

concurrency:
  group: kk-track-a-capacity-sandwich-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-partial-capacity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Restore Mathlib cache
        run: lake exe cache get
      - name: Independent sharp 26,880-case physical regression
        run: python3 scripts/check_partial_numeric_old_age.py
      - name: Explicitly compile upstream partial old physical modules
        run: |
          lake build Kk.PartialNumericOldColumns
          lake build Kk.PartialNumericCommonPool
          lake build Kk.PartialNumericAgeMonotonicity
      - name: Explicitly compile actual partial clique-capacity bounds
        run: lake build Kk.PartialNumericCapacityBounds
      - name: Strict exact qualified named transitive axiom check
        run: |
          set -euo pipefail
          python3 scripts/check_axiom_report.py --self-test
          lake env lean Kk/PartialNumericCapacityBounds.lean | tee partial-capacity-axioms.log
          python3 scripts/check_axiom_report.py Kk/PartialNumericCapacityBounds.lean partial-capacity-axioms.log
      - name: Full repository Lake build
        run: lake build
