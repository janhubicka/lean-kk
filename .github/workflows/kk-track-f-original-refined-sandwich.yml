name: KK Track F original refined sandwich
on:
  pull_request:
    paths:
      - 'Kk/TrackFOriginalRefinedAgeSandwich.lean'
      - 'Kk/TrackFOriginalRefinedAgeSandwichAxiomAudit.lean'
      - 'docs/track_f_original_refined_raw_sandwich_english_audit_20261119.md'
      - '.github/workflows/kk-track-f-original-refined-sandwich.yml'
  workflow_dispatch:
concurrency:
  group: kk-track-f-old-new-sandwich-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  original-refined-sandwich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Build original/refined source-target sandwich
        run: lake build Kk.TrackFOriginalRefinedAgeSandwich
      - name: Strict three-theorem standard-only axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackFOriginalRefinedAgeSandwichAxiomAudit.lean | tee track-f-old-new-sandwich-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackFOriginalRefinedAgeSandwichAxiomAudit.lean track-f-old-new-sandwich-axioms.log
