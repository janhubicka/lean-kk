name: KK whole-repository Lean source coverage audit

on:
  push:
    branches: [main]
    paths:
      - 'Kk/**'
      - 'Kk.lean'
      - 'scripts/audit_module_coverage.py'
      - 'scripts/test_module_coverage.py'
      - '.github/workflows/kk-module-coverage.yml'
  pull_request:
    paths:
      - 'Kk/**'
      - 'Kk.lean'
      - 'scripts/audit_module_coverage.py'
      - 'scripts/test_module_coverage.py'
      - '.github/workflows/kk-module-coverage.yml'
  workflow_dispatch:

jobs:
  structural-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate structural-audit parser against synthetic fixtures
        run: python3 -m unittest -v scripts.test_module_coverage
      - name: Classify all Lean modules and proof-holes
        run: python3 scripts/audit_module_coverage.py --output kk-module-coverage.json
      - name: Preserve the report as an audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: kk-module-coverage-report
          path: kk-module-coverage.json
