name: KK Track A finite tagged prefix encoding

on:
  pull_request:
    paths:
      - 'Kk/FiniteTaggedFutureEncoding.lean'
      - 'docs/finite_tagged_future_encoding_english_audit.md'
      - '.github/workflows/kk-track-a-tagged-encoding.yml'
  push:
    branches: [kk-track-a-relative-universal-encoding-20261114]
  workflow_dispatch:

concurrency:
  group: kk-track-a-tagged-encoding-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-tagged:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Restore Mathlib cache
        run: lake exe cache get
      - name: Explicitly compile finite tagged-future encoding
        run: lake build Kk.FiniteTaggedFutureEncoding
      - name: Strict named transitive axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/FiniteTaggedFutureEncoding.lean | tee tagged-encoding-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/FiniteTaggedFutureEncoding.lean tagged-encoding-axioms.log
      - name: Full existing library build
        run: lake build
