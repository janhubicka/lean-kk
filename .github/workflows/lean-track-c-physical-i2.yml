name: Lean Track C physical I2 equivalence

on:
  push:
    branches: [kk-track-c-physical-fork-equivalence-20261114]
    paths:
      - 'Kk/NumericHPhysicalI2Fork.lean'
      - 'docs/track_c_physical_i2_relation_english_audit.md'
      - '.github/workflows/lean-track-c-physical-i2.yml'
  pull_request:
    paths:
      - 'Kk/NumericHPhysicalI2Fork.lean'
      - 'docs/track_c_physical_i2_relation_english_audit.md'
      - '.github/workflows/lean-track-c-physical-i2.yml'
  workflow_dispatch:

concurrency:
  group: track-c-physical-i2-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  physical-i2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib cache
        run: lake exe cache get
      - name: Compile full physical I2 relation module
        run: lake build Kk.NumericHPhysicalI2Fork
      - name: Strictly check all four new named axioms
        run: |
          set -euo pipefail
          lake env lean Kk/NumericHPhysicalI2Fork.lean | tee track-c-physical-i2.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/NumericHPhysicalI2Fork.lean track-c-physical-i2.log
