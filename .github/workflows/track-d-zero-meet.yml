name: KK Track D — zero-L actual original meets cannot end at cut

on:
  pull_request:
    paths:
      - 'Kk/TrackDZeroMeetObstruction.lean'
      - 'scripts/check_axioms_track_d_zero_meet.lean'
      - '.github/workflows/track-d-zero-meet.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-d-zero-meet-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  zero-meet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib cache
        run: lake exe cache get
      - name: Build real original zero cut meet obstruction
        run: lake build Kk.TrackDZeroMeetObstruction
      - name: Strict one-theorem named axiom gate
        run: |
          set -euo pipefail
          lake env lean scripts/check_axioms_track_d_zero_meet.lean | tee track_d_zero_meet.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py scripts/check_axioms_track_d_zero_meet.lean track_d_zero_meet.log
