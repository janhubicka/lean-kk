name: Lean Track C changing-base actual run full source

on:
  push:
    branches: [kk-track-c-base-extended-run-stability-20261114]
    paths:
      - 'Kk/NumericHBaseExtendedRunStability.lean'
      - 'docs/track_c_base_extended_run_stability_english_audit.md'
      - '.github/workflows/lean-track-c-base-run-stability.yml'
  pull_request:
    paths:
      - 'Kk/NumericHBaseExtendedRunStability.lean'
      - 'docs/track_c_base_extended_run_stability_english_audit.md'
      - '.github/workflows/lean-track-c-base-run-stability.yml'
  workflow_dispatch:

concurrency:
  group: track-c-base-run-stability-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  base-extended-run-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib cache
        run: lake exe cache get
      - name: Explicitly compile base-extended run stability
        run: lake build Kk.NumericHBaseExtendedRunStability
      - name: Strict exact named transitive-axiom checks
        run: |
          set -euo pipefail
          lake env lean Kk/NumericHBaseExtendedRunStability.lean | tee track-c-base-run-stability.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/NumericHBaseExtendedRunStability.lean track-c-base-run-stability.log
