name: KK Track A uniform finite Henson front

on:
  pull_request:
    paths:
      - 'Kk/UniformFiniteHensonFront.lean'
      - 'docs/track_a_uniform_finite_henson_front_english_audit.md'
      - '.github/workflows/kk-track-a-uniform-finite.yml'
  push:
    branches: [kk-track-a-uniform-finite-front-20261114]
  workflow_dispatch:

concurrency:
  group: kk-track-a-uniform-finite-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-uniform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Restore Mathlib cache
        run: lake exe cache get
      - name: Explicitly build uniform finite front module
        run: lake build Kk.UniformFiniteHensonFront
      - name: Strict four-declaration named transitive axiom report
        run: |
          set -euo pipefail
          lake env lean Kk/UniformFiniteHensonFront.lean | tee uniform-front-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/UniformFiniteHensonFront.lean uniform-front-axioms.log
      - name: Full repository build
        run: lake build
