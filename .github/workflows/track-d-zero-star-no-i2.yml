name: KK Track D — actual zero full Kpt star excludes I2 forks

on:
  pull_request:
    paths:
      - 'Kk/TrackDZeroStarFullI2.lean'
      - 'scripts/check_axioms_track_d_zero_star_no_i2.lean'
      - '.github/workflows/track-d-zero-star-no-i2.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-d-zero-star-no-i2-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  full-no-i2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib cache
        run: lake exe cache get
      - name: Build actual full source zero-star no-fork
        run: lake build Kk.TrackDZeroStarFullI2
      - name: Strict two-theorem transitive axiom gate
        run: |
          set -euo pipefail
          lake env lean scripts/check_axioms_track_d_zero_star_no_i2.lean | tee track_d_zero_star_no_i2.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py scripts/check_axioms_track_d_zero_star_no_i2.lean track_d_zero_star_no_i2.log
