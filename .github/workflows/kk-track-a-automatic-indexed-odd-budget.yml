name: KK Track A/G automatically indexed odd Kpt Bad budget

on:
  pull_request:
    paths:
      - 'Kk/TrackAOddAutomaticIndexBudget.lean'
      - 'Kk/TrackAOddAutomaticIndexBudgetAxiomAudit.lean'
      - 'Kk.lean'
      - 'docs/track_a_odd_bad_automatic_candidate_index_english_audit_20261122.md'
      - '.github/workflows/kk-track-a-automatic-indexed-odd-budget.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-a-auto-odd-budget-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-full-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib cache
        run: lake exe cache get
      - name: Direct compile automatically indexed odd Bad bound
        run: lake build Kk.TrackAOddAutomaticIndexBudget
      - name: Full Lean library build
        run: lake build
      - name: Strict qualified two-name standard-only axiom reports
        run: |
          set -euo pipefail
          lake env lean Kk/TrackAOddAutomaticIndexBudgetAxiomAudit.lean | tee track-a-auto-odd-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackAOddAutomaticIndexBudgetAxiomAudit.lean track-a-auto-odd-axioms.log
