name: KK Track G exact finite-index factor Bad support iff same I/F run transport

on:
  pull_request:
    paths:
      - 'Kk/TrackGExactFactorBadCuts.lean'
      - 'Kk/TrackGExactFactorBadCutsAxiomAudit.lean'
      - 'docs/track_g_exact_factor_badcuts_english_audit_20261120.md'
      - '.github/workflows/kk-track-g-exact-factor-badcuts.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-g-exact-factor-badcuts-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile intrinsic finite target Kpt old-factor Bad cut support
        run: lake build Kk.TrackGExactFactorBadCuts
      - name: Strict three-name standard-only transitive axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackGExactFactorBadCutsAxiomAudit.lean | tee track-g-exact-factor-badcuts-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackGExactFactorBadCutsAxiomAudit.lean track-g-exact-factor-badcuts-axioms.log
