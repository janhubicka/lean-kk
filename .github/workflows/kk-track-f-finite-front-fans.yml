name: KK Track F finite front marker-disjoint fans
on:
  pull_request:
    paths:
      - 'Kk/TrackFFiniteFrontMarkerFans.lean'
      - 'Kk/TrackFFiniteFrontMarkerFansAxiomAudit.lean'
      - 'docs/track_f_finite_front_fans_english_audit.md'
      - '.github/workflows/kk-track-f-finite-front-fans.yml'
  workflow_dispatch:
concurrency:
  group: kk-track-f-finite-front-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  finite-front-fans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Build arbitrary finite-front daughter fan scheduler
        run: lake build Kk.TrackFFiniteFrontMarkerFans
      - name: Strict one-theorem standard-only axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackFFiniteFrontMarkerFansAxiomAudit.lean | tee track-f-finite-front-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackFFiniteFrontMarkerFansAxiomAudit.lean track-f-finite-front-axioms.log
