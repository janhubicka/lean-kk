name: Lean Track C tight chronological H+ old cutoff

on:
  push:
    branches: [kk-track-c-chronological-top-cut-20261114]
    paths:
      - 'Kk/NumericHChronologicalTopCut.lean'
      - 'docs/track_c_chronological_top_cut_english_audit.md'
      - '.github/workflows/lean-track-c-chronological-top.yml'
  pull_request:
    paths:
      - 'Kk/NumericHChronologicalTopCut.lean'
      - 'docs/track_c_chronological_top_cut_english_audit.md'
      - '.github/workflows/lean-track-c-chronological-top.yml'
  workflow_dispatch:

concurrency:
  group: track-c-chronological-top-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  true-chronological-top:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib cache
        run: lake exe cache get
      - name: Compile true previous-top H+ chronological cutoff module
        run: lake build Kk.NumericHChronologicalTopCut
      - name: Audit three exact named standard-only axioms
        run: |
          set -euo pipefail
          lake env lean Kk/NumericHChronologicalTopCut.lean | tee track-c-chronological-top.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/NumericHChronologicalTopCut.lean track-c-chronological-top.log
