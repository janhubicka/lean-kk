name: KK Track A exact real numeric cut raw event

on:
  pull_request:
    paths:
      - 'Kk/TrackANumericSingleCutRawEvent.lean'
      - 'Kk/TrackANumericSingleCutRawEventAxiomAudit.lean'
      - 'Kk.lean'
      - 'docs/track_a_numeric_one_cut_english_audit_20261122.md'
      - '.github/workflows/kk-track-a-single-numeric-cut.yml'
      - 'scripts/check_track_a_numeric_real_cut.py'
  workflow_dispatch:

concurrency:
  group: kk-track-a-single-numeric-cut-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  full-exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Independent 59136-case literal numeric H real/odd referee
        run: python3 scripts/check_track_a_numeric_real_cut.py
      - name: Compile exact numeric-cut module
        run: lake build Kk.TrackANumericSingleCutRawEvent
      - name: Full Lean library build
        run: lake build
      - name: Strict five-name standard-only transitive axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackANumericSingleCutRawEventAxiomAudit.lean | tee track-a-numeric-cut-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackANumericSingleCutRawEventAxiomAudit.lean track-a-numeric-cut-axioms.log
