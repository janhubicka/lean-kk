name: KK Track F actual code chronology and target lex
on:
  pull_request:
    paths:
      - 'Kk/TrackFFullActualZeroCodeAgeStep.lean'
      - 'Kk/TrackFActualZeroCodeTargetLex.lean'
      - 'Kk/TrackFActualZeroCodeTargetLexAxiomAudit.lean'
      - 'docs/track_f_zero_code_chronology_lex_english_audit_20261122.md'
      - '.github/workflows/kk-track-f-code-chronology-lex.yml'
  workflow_dispatch:
concurrency:
  group: kk-track-f-code-chronology-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  code-chronology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Build actual code chronological extension and target lex
        run: lake build Kk.TrackFActualZeroCodeTargetLex
      - name: Strict two-theorem standard-only axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackFActualZeroCodeTargetLexAxiomAudit.lean | tee code-chronology-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackFActualZeroCodeTargetLexAxiomAudit.lean code-chronology-axioms.log
