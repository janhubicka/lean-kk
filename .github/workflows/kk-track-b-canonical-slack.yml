name: KK Track B canonical-slack kernel gate

on:
  pull_request:
    paths:
      - 'Kk/CanonicalCriticalSlack.lean'
      - 'Kk/CanonicalCriticalSlackAxiomAudit.lean'
      - 'Kk/PhysicalCanonicalSlackCover.lean'
      - 'Kk.lean'
      - 'scripts/check_track_b_canonical_slack.py'
      - '.github/workflows/kk-track-b-canonical-slack.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-b-canonical-slack-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile exact Track B modules
        run: lake build Kk.CanonicalCriticalSlack Kk.PhysicalCanonicalSlackCover
      - name: Exact standard-only transitive axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/CanonicalCriticalSlackAxiomAudit.lean | tee track-b-slack-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/CanonicalCriticalSlackAxiomAudit.lean track-b-slack-axioms.log
