name: KK Track A partial numeric-H old columns

on:
  pull_request:
    paths:
      - 'Kk/PartialNumericOldColumns.lean'
      - 'docs/partial_numeric_old_columns_english_audit.md'
      - 'scripts/check_partial_numeric_old_age.py'
      - '.github/workflows/kk-track-a-partial-old-columns.yml'
  push:
    branches: [kk-track-a-partial-numeric-old-columns-20261115]
  workflow_dispatch:

concurrency:
  group: kk-track-a-partial-old-columns-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  partial-physical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Restore Mathlib cache
        run: lake exe cache get
      - name: Independent exact partial-prefix age regression
        run: python3 scripts/check_partial_numeric_old_age.py
      - name: Explicitly compile genuine partial-prefix physical module
        run: lake build Kk.PartialNumericOldColumns
      - name: Strict fully qualified named standard-only transitive axiom audit
        run: |
          set -euo pipefail
          python3 scripts/check_axiom_report.py --self-test
          lake env lean Kk/PartialNumericOldColumns.lean | tee partial-old-axioms.log
          python3 scripts/check_axiom_report.py Kk/PartialNumericOldColumns.lean partial-old-axioms.log
      - name: Full repository build
        run: lake build
