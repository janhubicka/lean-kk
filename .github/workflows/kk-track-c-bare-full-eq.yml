name: KK Track C bare/full same selections

on:
  pull_request:
    paths:
      - 'Kk/BareFullRunSelectedEquivalence.lean'
      - 'Kk/TrackCBareFullSelectedAxiomAudit.lean'
      - 'docs/track_c_bare_full_run_selections_english_audit.md'
      - '.github/workflows/kk-track-c-bare-full-eq.yml'
  workflow_dispatch:

jobs:
  same-selections-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib cache
        run: lake exe cache get
      - name: Build actual bare/full selected-level equivalence
        run: lake build Kk.BareFullRunSelectedEquivalence
      - name: Exact two-theorem standard-only axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackCBareFullSelectedAxiomAudit.lean | tee track-c-barefull-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackCBareFullSelectedAxiomAudit.lean track-c-barefull-axioms.log
