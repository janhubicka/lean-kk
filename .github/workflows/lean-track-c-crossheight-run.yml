name: Lean Track C cross-height actual AlgorithmRun retention

on:
  push:
    branches: [kk-track-c-crossheight-algorithm-retention-20261114]
    paths:
      - 'Kk/AlgorithmRunCrossHeightMonotonicity.lean'
      - 'docs/track_c_crossheight_run_retention_english_audit.md'
      - '.github/workflows/lean-track-c-crossheight-run.yml'
  pull_request:
    paths:
      - 'Kk/AlgorithmRunCrossHeightMonotonicity.lean'
      - 'docs/track_c_crossheight_run_retention_english_audit.md'
      - '.github/workflows/lean-track-c-crossheight-run.yml'
  workflow_dispatch:

concurrency:
  group: track-c-crossheight-run-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  crossheight-retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib cache
        run: lake exe cache get
      - name: Explicitly compile true cross-height Kpt run monotonicity
        run: lake build Kk.AlgorithmRunCrossHeightMonotonicity
      - name: Audit three exact named standard-only transitive axioms
        run: |
          set -euo pipefail
          lake env lean Kk/AlgorithmRunCrossHeightMonotonicity.lean | tee track-c-crossheight-run.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/AlgorithmRunCrossHeightMonotonicity.lean track-c-crossheight-run.log
