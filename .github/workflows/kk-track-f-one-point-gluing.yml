name: KK Track F actual finite sorted one-point gluing safety
on:
  pull_request:
    paths:
      - 'Kk/TrackFOnePointGluingSafety.lean'
      - 'Kk/TrackFOnePointGluingSafetyAxiomAudit.lean'
      - 'docs/track_f_one_point_gluing_safety_english_audit.md'
      - '.github/workflows/kk-track-f-one-point-gluing.yml'
  workflow_dispatch:
concurrency:
  group: kk-track-f-gluing-safety-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  one-point-gluing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Build sorted one-point gluing safety
        run: lake build Kk.TrackFOnePointGluingSafety
      - name: Strict two-theorem standard-only axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackFOnePointGluingSafetyAxiomAudit.lean | tee track-f-one-point-gluing-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackFOnePointGluingSafetyAxiomAudit.lean track-f-one-point-gluing-axioms.log
