name: KK Track F zero-code preprofile rigidity
on:
  pull_request:
    paths:
      - 'Kk/TrackFZeroCodePreprofileRigidity.lean'
      - 'Kk/TrackFZeroCodePreprofileRigidityAxiomAudit.lean'
      - 'docs/track_f_zero_code_preprofile_rigidity_english_audit_20261121.md'
      - '.github/workflows/kk-track-f-zero-code-preprofile.yml'
  workflow_dispatch:
concurrency:
  group: kk-track-f-code-preprofile-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  preprofile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Build actual zero-code preprofile rigidity
        run: lake build Kk.TrackFZeroCodePreprofileRigidity
      - name: Strict named standard-only axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackFZeroCodePreprofileRigidityAxiomAudit.lean | tee track-f-zero-preprofile-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackFZeroCodePreprofileRigidityAxiomAudit.lean track-f-zero-preprofile-axioms.log
