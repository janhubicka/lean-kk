name: KK Track E one bare-root old-boring even-real physical no-novelty

on:
  pull_request:
    paths:
      - 'Kk/TrackEOneBareRootEvenRealNoNovelty.lean'
      - 'Kk/TrackEOneBareRootEvenRealNoNoveltyAxiomAudit.lean'
      - 'docs/track_e_one_bare_root_even_real_certificate_english_audit_20261120.md'
      - '.github/workflows/kk-track-e-one-bare-root-real-cut.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-e-oneroot-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile one physical bare-root candidate old-boring even-real no-novelty
        run: lake build Kk.TrackEOneBareRootEvenRealNoNovelty
      - name: Strict three-endpoint transitive-axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackEOneBareRootEvenRealNoNoveltyAxiomAudit.lean | tee track-e-oneroot-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackEOneBareRootEvenRealNoNoveltyAxiomAudit.lean track-e-oneroot-axioms.log
