name: KK Track A sorted original clique from capacity

on:
  pull_request:
    paths:
      - 'Kk/OrderedCliquePrefixWitness.lean'
      - 'docs/ordered_clique_prefix_witness_english_audit.md'
      - '.github/workflows/kk-track-a-sorted-clique-witness.yml'
  push:
    branches: [kk-track-a-sorted-clique-witness-20261116]
  workflow_dispatch:

concurrency:
  group: kk-track-a-sorted-clique-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-sorted-clique:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Restore Mathlib cache
        run: lake exe cache get
      - name: Build exact original sorted-clique witness
        run: lake build Kk.OrderedCliquePrefixWitness
      - name: Strict qualified standard-only named-axiom audit
        run: |
          set -euo pipefail
          python3 scripts/check_axiom_report.py --self-test
          lake env lean Kk/OrderedCliquePrefixWitness.lean | tee sorted-clique-axioms.log
          python3 scripts/check_axiom_report.py Kk/OrderedCliquePrefixWitness.lean sorted-clique-axioms.log
      - name: Full Lean repository build
        run: lake build
