name: KK Track E complete actual numerical H Kpt closure event source trace

on:
  pull_request:
    paths:
      - 'Kk/TrackENumericCompletePhysicalTrace.lean'
      - 'Kk/TrackENumericCompletePhysicalTraceAxiomAudit.lean'
      - 'docs/track_e_numeric_complete_parameter_trace_english_audit.md'
      - '.github/workflows/kk-track-e-numeric-complete-trace.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-e-numerictrace-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile complete numerical H Kpt physical event-source trace
        run: lake build Kk.TrackENumericCompletePhysicalTrace
      - name: Strict one-endpoint transitive-axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackENumericCompletePhysicalTraceAxiomAudit.lean | tee track-e-numerictrace-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackENumericCompletePhysicalTraceAxiomAudit.lean track-e-numerictrace-axioms.log
