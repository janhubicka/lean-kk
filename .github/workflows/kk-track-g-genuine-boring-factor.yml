name: KK Track G actual boring-block monoid factor and K4 obstacle

on:
  pull_request:
    paths:
      - 'Kk/TrackGGenuineBoringBlockFactor.lean'
      - 'Kk/TrackGGenuineBoringBlockFactorAxiomAudit.lean'
      - 'docs/track_g_genuine_boring_block_monoid_factor_english_audit_20261117.md'
      - '.github/workflows/kk-track-g-genuine-boring-factor.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-g-boring-block-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile genuine boring-block Kpt monoid-factor module
        run: lake build Kk.TrackGGenuineBoringBlockFactor
      - name: Strict four-name standard-only axioms
        run: |
          set -euo pipefail
          lake env lean Kk/TrackGGenuineBoringBlockFactorAxiomAudit.lean | tee track-g-boring-block-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackGGenuineBoringBlockFactorAxiomAudit.lean track-g-boring-block-axioms.log
