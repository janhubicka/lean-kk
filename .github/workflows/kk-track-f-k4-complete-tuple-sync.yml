name: KK Track F full K4 tuple synchronization
on:
  pull_request:
    paths:
      - 'Kk/TrackFK4CompleteTupleSynchronization.lean'
      - 'Kk/TrackFK4CompleteTupleSynchronizationAxiomAudit.lean'
      - 'docs/track_f_k4_complete_tuple_synchronization_english_audit_20261120.md'
      - '.github/workflows/kk-track-f-k4-complete-tuple-sync.yml'
  workflow_dispatch:
concurrency:
  group: kk-track-f-full-tuple-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  full-tuple:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Build complete K4 tuple synchronization
        run: lake build Kk.TrackFK4CompleteTupleSynchronization
      - name: Strict named standard-only axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackFK4CompleteTupleSynchronizationAxiomAudit.lean | tee track-f-complete-tuple-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackFK4CompleteTupleSynchronizationAxiomAudit.lean track-f-complete-tuple-axioms.log
