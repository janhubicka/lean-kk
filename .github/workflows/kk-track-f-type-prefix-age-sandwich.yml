name: KK Track F true prefix canonical age sandwich
on:
  pull_request:
    paths:
      - 'Kk/TrackFTypePrefixCanonicalAgeSandwich.lean'
      - 'Kk/TrackFTypePrefixCanonicalAgeSandwichAxiomAudit.lean'
      - 'docs/track_f_type_prefix_canonical_age_sandwich_english_audit_20261121.md'
      - '.github/workflows/kk-track-f-type-prefix-age-sandwich.yml'
  workflow_dispatch:
concurrency:
  group: kk-track-f-prefix-sandwich-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  prefix-sandwich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Build physical prefix canonical age sandwich
        run: lake build Kk.TrackFTypePrefixCanonicalAgeSandwich
      - name: Strict four-theorem standard-only axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackFTypePrefixCanonicalAgeSandwichAxiomAudit.lean | tee track-f-prefix-sandwich-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackFTypePrefixCanonicalAgeSandwichAxiomAudit.lean track-f-prefix-sandwich-axioms.log
