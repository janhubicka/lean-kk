name: KK Track D — true odd cuts require structural I1 or I2

on:
  pull_request:
    paths:
      - 'Kk/ActualRunOddStructural.lean'
      - 'scripts/check_axioms_track_d_actual_odd_structural.lean'
      - '.github/workflows/track-d-actual-odd-structural.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-d-odd-structural-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  odd-structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib cache
        run: lake exe cache get
      - name: Compile actual odd-cut structural theorem
        run: lake build Kk.ActualRunOddStructural
      - name: Strict named transitive-axiom gate
        run: |
          set -euo pipefail
          lake env lean scripts/check_axioms_track_d_actual_odd_structural.lean | tee track_d_odd_structural.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py scripts/check_axioms_track_d_actual_odd_structural.lean track_d_odd_structural.log
