name: KK Track E one bare root small original pool and source test budget

on:
  pull_request:
    paths:
      - 'Kk/TrackEBareRootSmallOriginalPool.lean'
      - 'Kk/TrackEBareRootSmallOriginalPoolAxiomAudit.lean'
      - 'docs/track_e_bare_root_small_original_pool_english_audit_20261122.md'
      - '.github/workflows/kk-track-e-bare-root-small-original-pool.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-e-barepool-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile actual old finite Kpt seeds plus one specified bare root small pool
        run: lake build Kk.TrackEBareRootSmallOriginalPool
      - name: Strict two-endpoint transitive-axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackEBareRootSmallOriginalPoolAxiomAudit.lean | tee track-e-barepool-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackEBareRootSmallOriginalPoolAxiomAudit.lean track-e-barepool-axioms.log
