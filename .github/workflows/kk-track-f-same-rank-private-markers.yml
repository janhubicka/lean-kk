name: KK Track F same rank private markers
on:
  pull_request:
    paths:
      - 'Kk/TrackFPrivateMarkerFullRawProfile.lean'
      - 'Kk/TrackFPrivateMarkerFullRawProfileAxiomAudit.lean'
      - 'docs/track_f_same_rank_private_marker_raw_profile_english_audit_20261119.md'
      - '.github/workflows/kk-track-f-same-rank-private-markers.yml'
  workflow_dispatch:
concurrency:
  group: kk-track-f-private-markers-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  private-markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Build private fresh-marker source raw-profile theorem
        run: lake build Kk.TrackFPrivateMarkerFullRawProfile
      - name: Strict four-theorem standard-only axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackFPrivateMarkerFullRawProfileAxiomAudit.lean | tee track-f-private-markers-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackFPrivateMarkerFullRawProfileAxiomAudit.lean track-f-private-markers-axioms.log
