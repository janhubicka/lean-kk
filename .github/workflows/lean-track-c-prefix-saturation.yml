name: Lean Track C prefix-saturation I1 obstruction

on:
  push:
    branches: [kk-track-c-prefix-saturation-obstruction-20261114]
    paths:
      - 'Kk/PrefixSaturationI1Obstruction.lean'
      - 'docs/track_c_prefix_saturation_I1_english_audit.md'
      - '.github/workflows/lean-track-c-prefix-saturation.yml'
  pull_request:
    paths:
      - 'Kk/PrefixSaturationI1Obstruction.lean'
      - 'docs/track_c_prefix_saturation_I1_english_audit.md'
      - '.github/workflows/lean-track-c-prefix-saturation.yml'
  workflow_dispatch:

concurrency:
  group: track-c-prefix-saturation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  actual-i1-obstruction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib cache
        run: lake exe cache get
      - name: Explicitly compile prefix-saturation I1 obstruction
        run: lake build Kk.PrefixSaturationI1Obstruction
      - name: Audit three exact named standard-only transitive axioms
        run: |
          set -euo pipefail
          lake env lean Kk/PrefixSaturationI1Obstruction.lean | tee track-c-prefix-saturation.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/PrefixSaturationI1Obstruction.lean track-c-prefix-saturation.log
