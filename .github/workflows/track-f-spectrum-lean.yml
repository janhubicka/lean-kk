name: Track F initial spectra

on:
  pull_request:
    paths:
      - 'Kk/TrackFBranchSpectrum.lean'
      - 'Kk/TrackFBranchSpectrumCover.lean'
      - 'docs/track_f_branch_spectrum_english_audit.md'
      - 'scripts/track_f_spectrum_axioms.lean'
      - '.github/workflows/track-f-spectrum-lean.yml'
  workflow_dispatch:

jobs:
  exact-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml','lean-toolchain','lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Dependencies
        run: lake update
      - name: Mathlib cache
        run: lake exe cache get
      - name: Compile spectrum module
        run: lake build Kk.TrackFBranchSpectrum Kk.TrackFBranchSpectrumCover
      - name: Strict five-theorem axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean scripts/track_f_spectrum_axioms.lean | tee spectrum.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          data=Path("spectrum.log").read_text()
          expected=["Kk.trackFSeenSymbol_append",
            "Kk.trackFBranchInitial_append",
            "Kk.trackFAllBranchInitial_append",
            "Kk.trackFWordSpectrum_age_cover",
            "Kk.trackFWordSpectrum_coding_column"]
          allowed={"propext","Classical.choice","Quot.sound"}
          for name in expected:
              m=re.search(r"(?m)^'"+re.escape(name)+r"' depends on axioms: \[([^\]]*)\]",data)
              if not m: raise SystemExit("MISSING "+name)
              axioms={x.strip() for x in m.group(1).split(",") if x.strip()}
              if axioms-allowed: raise SystemExit("FORBIDDEN "+name+" "+str(axioms-allowed))
              print("PASS "+name+" "+str(sorted(axioms)))
          PY
