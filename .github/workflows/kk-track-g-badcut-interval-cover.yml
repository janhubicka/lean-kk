name: KK Track G bad cut covered by actual Kpt novelty interval

on:
  pull_request:
    paths:
      - 'Kk/TrackGBadCutIntervalCover.lean'
      - 'Kk/TrackGBadCutIntervalCoverAxiomAudit.lean'
      - 'docs/track_g_badcut_interval_cover_english_audit_20261117.md'
      - '.github/workflows/kk-track-g-badcut-interval-cover.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-g-badcut-interval-cover-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Explicitly compile actual Kpt bad-cut interval cover
        run: lake build Kk.TrackGBadCutIntervalCover
      - name: Two exact named standard-only transitive-axiom reports
        run: |
          set -euo pipefail
          lake env lean Kk/TrackGBadCutIntervalCoverAxiomAudit.lean | tee track-g-badcut-interval-cover-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackGBadCutIntervalCoverAxiomAudit.lean track-g-badcut-interval-cover-axioms.log
