name: KK Track F precode endpoint age sandwich
on:
  pull_request:
    paths:
      - 'Kk/TrackFPrecodeEndpointAgeSandwich.lean'
      - 'Kk/TrackFPrecodeEndpointAgeSandwichAxiomAudit.lean'
      - 'docs/track_f_precode_endpoint_age_sandwich_english_audit_20261122.md'
      - '.github/workflows/kk-track-f-precode-endpoint-age-sandwich.yml'
  workflow_dispatch:
concurrency:
  group: kk-track-f-endpoint-sandwich-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  endpoint-sandwich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Build complete actual precode endpoint-age sandwich
        run: lake build Kk.TrackFPrecodeEndpointAgeSandwich
      - name: Strict three-theorem standard-only axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackFPrecodeEndpointAgeSandwichAxiomAudit.lean | tee track-f-endpoint-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackFPrecodeEndpointAgeSandwichAxiomAudit.lean track-f-endpoint-axioms.log
