name: KK Track F rank-one to zero actual compatible drop
on:
  pull_request:
    paths:
      - 'Kk/TrackFRankOneDropToZero.lean'
      - 'Kk/TrackFRankOneDropToZeroAxiomAudit.lean'
      - 'docs/track_f_rank_one_drop_to_zero_english_audit.md'
      - '.github/workflows/kk-track-f-rank-one-drop.yml'
  workflow_dispatch:
concurrency:
  group: kk-track-f-rank-one-drop-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  rank-one-drop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Build actual rank-one-to-zero compatible drop
        run: lake build Kk.TrackFRankOneDropToZero
      - name: Strict one-theorem standard-only axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackFRankOneDropToZeroAxiomAudit.lean | tee track-f-rank-one-drop-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackFRankOneDropToZeroAxiomAudit.lean track-f-rank-one-drop-axioms.log
