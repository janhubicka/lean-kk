name: KK Track F full actual zero code age stage
on:
  pull_request:
    paths:
      - 'Kk/TrackFFullActualZeroCodeAgeStep.lean'
      - 'Kk/TrackFFullActualZeroCodeAgeStepAxiomAudit.lean'
      - 'docs/track_f_full_actual_zero_code_age_stage_english_audit_20261122.md'
      - '.github/workflows/kk-track-f-full-actual-zero-code-step.yml'
  workflow_dispatch:
concurrency:
  group: kk-track-f-full-zero-code-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  full-code-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Build full physical K4 zero-code age stage
        run: lake build Kk.TrackFFullActualZeroCodeAgeStep
      - name: Strict standard-only named axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackFFullActualZeroCodeAgeStepAxiomAudit.lean | tee track-f-full-code-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackFFullActualZeroCodeAgeStepAxiomAudit.lean track-f-full-code-axioms.log
