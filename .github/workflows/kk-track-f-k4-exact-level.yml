name: KK Track F exact level K4 singleton compatible transport
on:
  pull_request:
    paths:
      - 'Kk/TrackFK4ExactLevelTransport.lean'
      - 'Kk/TrackFK4ExactLevelTransportAxiomAudit.lean'
      - 'Kk/TrackFK4FullSingletonTransport.lean'
      - 'Kk/TrackFExactTargetPrefixRestriction.lean'
      - 'docs/track_f_k4_exact_target_level_english_audit.md'
      - '.github/workflows/kk-track-f-k4-exact-level.yml'
  workflow_dispatch:
concurrency:
  group: kk-track-f-k4-exact-level-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  k4-exact-target-level:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Build exact-level all K4 singleton source-target continuation
        run: lake build Kk.TrackFK4ExactLevelTransport
      - name: Strict one-theorem standard-only axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackFK4ExactLevelTransportAxiomAudit.lean | tee track-f-k4-exact-level-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackFK4ExactLevelTransportAxiomAudit.lean track-f-k4-exact-level-axioms.log
