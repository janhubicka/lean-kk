name: KK Track D — actual full AlgorithmRun B3 core

on:
  pull_request:
    paths:
      - 'Kk/B3ActualRunFullBadCoreIff.lean'
      - 'scripts/check_axioms_actual_run_full_core.lean'
      - '.github/workflows/track-d-actual-run-core.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-d-actual-full-core-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  full-actual-run-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile actual full AlgorithmRun Track D module
        run: lake build Kk.B3ActualRunFullBadCoreIff
      - name: Strict named transitive-axiom report
        run: |
          set -euo pipefail
          lake env lean scripts/check_axioms_actual_run_full_core.lean | tee actual_full_core_axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py scripts/check_axioms_actual_run_full_core.lean actual_full_core_axioms.log
