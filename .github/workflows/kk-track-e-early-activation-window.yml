name: KK Track E early old-final Kpt activation windows and unbounded-length regression

on:
  pull_request:
    paths:
      - 'Kk/TrackEEarlyOldFinalActivationInterval.lean'
      - 'Kk/TrackEEarlyOldFinalActivationIntervalAxiomAudit.lean'
      - 'docs/track_e_early_activation_window_english_audit_20261118.md'
      - '.github/workflows/kk-track-e-early-activation-window.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-e-window-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile actual Kpt early old-final activation interval module
        run: lake build Kk.TrackEEarlyOldFinalActivationInterval
      - name: Strict four-endpoint transitive-axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackEEarlyOldFinalActivationIntervalAxiomAudit.lean | tee track-e-window-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackEEarlyOldFinalActivationIntervalAxiomAudit.lean track-e-window-axioms.log
