name: KK Track F zero-code cut survivor age
on:
  pull_request:
    paths:
      - 'Kk/TrackFZeroCodeCutSurvivorAge.lean'
      - 'Kk/TrackFZeroCodeCutSurvivorAgeAxiomAudit.lean'
      - 'docs/track_f_immediate_postcode_zero_survivor_age_english_audit_20261121.md'
      - '.github/workflows/kk-track-f-zero-code-survivor-age.yml'
  workflow_dispatch:
concurrency:
  group: kk-track-f-zero-survivor-age-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  zero-cut-age:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Build actual survivor zero-code cut age
        run: lake build Kk.TrackFZeroCodeCutSurvivorAge
      - name: Strict four-theorem standard-only axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackFZeroCodeCutSurvivorAgeAxiomAudit.lean | tee track-f-zero-cut-age-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackFZeroCodeCutSurvivorAgeAxiomAudit.lean track-f-zero-cut-age-axioms.log
