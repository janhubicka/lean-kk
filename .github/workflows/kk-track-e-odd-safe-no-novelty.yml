name: KK Track E odd physical Kpt source no-novelty with no E-free stage endpoint

on:
  pull_request:
    paths:
      - 'Kk/TrackEOddSafeSourceNoNovelty.lean'
      - 'Kk/TrackEOddSafeSourceNoNoveltyAxiomAudit.lean'
      - 'docs/track_e_odd_safe_zero_source_no_novelty_english_audit_20261121.md'
      - '.github/workflows/kk-track-e-odd-safe-no-novelty.yml'
  workflow_dispatch:

concurrency:
  group: kk-track-e-oddsafe-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-build-and-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Obtain Mathlib build cache
        run: lake exe cache get
      - name: Compile genuine odd source physical no-novelty excluding stage E-free endpoints
        run: lake build Kk.TrackEOddSafeSourceNoNovelty
      - name: Strict three-endpoint transitive-axiom gate
        run: |
          set -euo pipefail
          lake env lean Kk/TrackEOddSafeSourceNoNoveltyAxiomAudit.lean | tee track-e-oddsafe-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/TrackEOddSafeSourceNoNoveltyAxiomAudit.lean track-e-oddsafe-axioms.log
