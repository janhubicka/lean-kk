name: Lean Track C base original extension full L+ source

on:
  push:
    branches: [kk-track-c-base-original-extension-20261114]
    paths:
      - 'Kk/NumericHBaseExtensionCoherence.lean'
      - 'docs/track_c_base_extension_coherence_english_audit.md'
      - '.github/workflows/lean-track-c-base-extension.yml'
  pull_request:
    paths:
      - 'Kk/NumericHBaseExtensionCoherence.lean'
      - 'docs/track_c_base_extension_coherence_english_audit.md'
      - '.github/workflows/lean-track-c-base-extension.yml'
  workflow_dispatch:

concurrency:
  group: track-c-base-extension-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  base-full-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lean workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Obtain Mathlib cache
        run: lake exe cache get
      - name: Compile new-base actual H+ old source coherence
        run: lake build Kk.NumericHBaseExtensionCoherence
      - name: Audit nine exact named standard-only theorem axioms
        run: |
          set -euo pipefail
          lake env lean Kk/NumericHBaseExtensionCoherence.lean | tee track-c-base-extension.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/NumericHBaseExtensionCoherence.lean track-c-base-extension.log
