name: KK Track A genuine finite positive support stage

on:
  pull_request:
    paths:
      - 'Kk/SupportBlockGapAge.lean'
      - 'Kk/PhysicalIsolatedSupportStage.lean'
      - 'docs/physical_isolated_support_stage_english_audit.md'
      - '.github/workflows/kk-track-a-physical-support-stage.yml'
  push:
    branches: [kk-track-a-physical-positive-support-stage-20261114]
  workflow_dispatch:

concurrency:
  group: kk-track-a-physical-support-stage-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-physical-support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Restore Mathlib cache
        run: lake exe cache get
      - name: Compile gap-inclusive raw old-column age
        run: lake build Kk.SupportBlockGapAge
      - name: Compile genuine finite positive support stage
        run: lake build Kk.PhysicalIsolatedSupportStage
      - name: Strict fully qualified named transitive axiom gate
        run: |
          set -euo pipefail
          python3 scripts/check_axiom_report.py --self-test
          lake env lean Kk/SupportBlockGapAge.lean | tee support-gap-axioms.log
          python3 scripts/check_axiom_report.py Kk/SupportBlockGapAge.lean support-gap-axioms.log
          lake env lean Kk/PhysicalIsolatedSupportStage.lean | tee physical-support-axioms.log
          python3 scripts/check_axiom_report.py Kk/PhysicalIsolatedSupportStage.lean physical-support-axioms.log
      - name: Full repository build
        run: lake build
