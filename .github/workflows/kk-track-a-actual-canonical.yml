name: KK Track A actual isolated canonical cover age

on:
  pull_request:
    paths:
      - 'Kk/IsolatedSupportCanonicalAge.lean'
      - 'docs/isolated_support_canonical_age_english_audit.md'
      - '.github/workflows/kk-track-a-actual-canonical.yml'
  push:
    branches: [kk-track-a-actual-reserved-canonical-20261114]
  workflow_dispatch:

concurrency:
  group: kk-track-a-actual-canonical-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-actual-canonical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned Lake workspace
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lean-kk-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            lean-kk-${{ runner.os }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Restore Mathlib cache
        run: lake exe cache get
      - name: Explicitly compile actual reserved canonical cover module
        run: lake build Kk.IsolatedSupportCanonicalAge
      - name: Strict seven-theorem standard-only transitive axiom audit
        run: |
          set -euo pipefail
          lake env lean Kk/IsolatedSupportCanonicalAge.lean | tee actual-reserved-canonical-axioms.log
          python3 scripts/check_axiom_report.py --self-test
          python3 scripts/check_axiom_report.py Kk/IsolatedSupportCanonicalAge.lean actual-reserved-canonical-axioms.log
      - name: Full repository build
        run: lake build
